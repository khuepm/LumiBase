<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e2a3f" stroke-width="1" opacity="0.5">
    <line x1="0" y1="105" x2="1000" y2="105"/>
    <line x1="0" y1="210" x2="1000" y2="210"/>
    <line x1="0" y1="315" x2="1000" y2="315"/>
  </g>

  <!-- Title block -->
  <text x="60" y="86" fill="url(#accent)" font-size="20" font-weight="700" letter-spacing="3">CWE-918 · SSRF</text>
  <text x="60" y="140" fill="#f1f5f9" font-size="46" font-weight="800">The Server That</text>
  <text x="60" y="192" fill="#f1f5f9" font-size="46" font-weight="800">Robs Itself</text>
  <text x="62" y="236" fill="#94a3b8" font-size="19">How Lumibase shut the door on Server-Side Request Forgery</text>

  <!-- Attacker -->
  <g transform="translate(70,290)">
    <circle cx="26" cy="26" r="26" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <circle cx="26" cy="20" r="7" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <path d="M13 40 Q26 26 39 40" fill="none" stroke="#f87171" stroke-width="2.5"/>
    <text x="26" y="82" text-anchor="middle" fill="#94a3b8" font-size="13">attacker</text>
  </g>

  <!-- arrow attacker -> server -->
  <line x1="140" y1="316" x2="235" y2="316" stroke="#f87171" stroke-width="3"/>
  <polygon points="235,316 224,310 224,322" fill="#f87171"/>
  <text x="150" y="304" fill="#f87171" font-size="12">crafted URL</text>

  <!-- Server (trusted courier) -->
  <g transform="translate(250,282)">
    <rect x="0" y="0" width="120" height="70" rx="10" fill="#13233b" stroke="#22d3ee" stroke-width="2"/>
    <rect x="42" y="14" width="36" height="24" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="52" y1="42" x2="68" y2="42" stroke="#22d3ee" stroke-width="2.5"/>
    <line x1="60" y1="38" x2="60" y2="42" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="60" y="60" text-anchor="middle" fill="#cbd5e1" font-size="13">trusted server</text>
  </g>

  <!-- Guard shield between server and metadata -->
  <g transform="translate(430,270)" filter="url(#glow)">
    <path d="M55 0 L110 20 L110 60 Q110 96 55 116 Q0 96 0 60 L0 20 Z" fill="#052e26" stroke="url(#accent)" stroke-width="3"/>
    <path d="M38 46 L51 59 L74 32" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="86" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">SSRF</text>
    <text x="55" y="102" text-anchor="middle" fill="#34d399" font-size="13" font-weight="700">guard</text>
  </g>

  <!-- blocked arrow server -> guard -->
  <line x1="370" y1="316" x2="425" y2="316" stroke="#22d3ee" stroke-width="3"/>

  <!-- big BLOCKED cross after guard -->
  <g transform="translate(560,300)">
    <line x1="0" y1="0" x2="34" y2="34" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <line x1="34" y1="0" x2="0" y2="34" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
    <text x="17" y="62" text-anchor="middle" fill="#f87171" font-size="12" font-weight="700">BLOCKED</text>
  </g>

  <!-- Metadata vault (faded / unreachable) -->
  <g transform="translate(650,278)" opacity="0.55">
    <rect x="0" y="0" width="150" height="78" rx="10" fill="#1a1420" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="65" y="20" width="20" height="15" rx="3" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M69 20 V16 a6 6 0 0 1 12 0 V20" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="75" y="54" text-anchor="middle" fill="#94a3b8" font-size="12">169.254.169.254</text>
    <text x="75" y="71" text-anchor="middle" fill="#64748b" font-size="11">cloud metadata</text>
  </g>

  <!-- Blocklist chips -->
  <g font-size="13" fill="#0b1120" font-weight="700">
    <g transform="translate(650,120)"><rect width="112" height="26" rx="13" fill="url(#accent)"/><text x="56" y="18" text-anchor="middle">RFC1918</text></g>
    <g transform="translate(772,120)"><rect width="112" height="26" rx="13" fill="url(#accent)"/><text x="56" y="18" text-anchor="middle">loopback</text></g>
    <g transform="translate(650,156)"><rect width="112" height="26" rx="13" fill="url(#accent)"/><text x="56" y="18" text-anchor="middle">link-local</text></g>
    <g transform="translate(772,156)"><rect width="112" height="26" rx="13" fill="url(#accent)"/><text x="56" y="18" text-anchor="middle">IPv4 + IPv6</text></g>
  </g>

  <!-- footer brand -->
  <text x="60" y="392" fill="#475569" font-size="15">lumibase.dev — Content OS · build in public</text>
  <path d="M312 388 q6 -12 16 -12 q-2 12 -16 12 z" fill="#34d399"/>
</svg>
