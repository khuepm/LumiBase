# Render Blueprint — LumiBase CMS + Studio (#741)
#
# One-click: https://render.com/deploy?repo=https://github.com/khuepm/lumibase
#
# Creates three resources and wires them together; nothing to type in:
#   - lumibase        web service running the published image (API + Studio)
#   - lumibase-db     Render Postgres 16
#   - lumibase-redis  Render Key Value (Redis-compatible; cache, queues, locks)
#
# Secrets are generated by Render at first sync and never live in this file:
# JWT_SECRET and ENCRYPTION_KEY use `generateValue` (a base64-encoded 256-bit
# value — exactly the AES-256 key ENCRYPTION_KEY must be). CORS_ALLOWED_ORIGINS
# is derived at boot from RENDER_EXTERNAL_URL by the image entrypoint.
#
# After the deploy is live, open https://<service>.onrender.com/setup. Setup is
# gated by a one-time token (LUMIBASE_REQUIRE_SETUP_TOKEN): copy the
# `SETUP_TOKEN=` line from the service's logs. The entrypoint also prints the
# exact setup URL there. See docs/en/deployment/one-click.md.
#
# Not provisioned (optional; the instance boots and setup completes without
# them): S3-compatible media storage, Meilisearch, imgproxy. Add their
# variables in the dashboard when you need uploads, search or transforms.

services:
  - type: web
    name: lumibase
    runtime: image
    image:
      # Pin a release tag for production; `latest` follows the newest release.
      url: ghcr.io/khuepm/lumibase-cms:latest
    # Free instances spin down when idle, which stops the scheduler, the
    # veto-commit sweep and the queue workers this process runs. Starter is
    # the smallest plan that stays up.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LUMIBASE_ENV
        value: production
      - key: LUMIBASE_RUNTIME
        value: docker
      - key: PORT
        value: "1989"
      # The instance is on the public internet before anyone has set it up;
      # without the token, whoever reaches /setup first owns it.
      - key: LUMIBASE_REQUIRE_SETUP_TOKEN
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lumibase-db
          property: connectionString
      # The connection string above is Render's internal URL: same account,
      # same region, private network. Render documents it without sslmode.
      # Use `require` (and an external URL with sslmode) for a database
      # outside Render.
      - key: DATABASE_SSL_MODE
        value: disable
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lumibase-redis
          property: connectionString

  - type: keyvalue
    name: lumibase-redis
    plan: starter
    # BullMQ queues must never be evicted under memory pressure.
    maxmemoryPolicy: noeviction
    # Internal connections only.
    ipAllowList: []

databases:
  - name: lumibase-db
    databaseName: lumibase
    user: lumibase
    plan: basic-256mb
    postgresMajorVersion: "16"
    # Internal connections only.
    ipAllowList: []
