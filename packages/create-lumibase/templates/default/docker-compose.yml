services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumibase
      POSTGRES_PASSWORD: lumibase
      POSTGRES_DB: lumibase
    # Loopback only: the password above is a development default.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Loopback only: Redis has no auth configured here.
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
