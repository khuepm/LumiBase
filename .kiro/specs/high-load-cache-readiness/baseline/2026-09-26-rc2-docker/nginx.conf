events { worker_connections 1024; }
http {
  proxy_cache_path /tmp/cache levels=1:2 keys_zone=delivery:16m max_size=128m inactive=5m;
  log_format proof '$status $upstream_cache_status $request_uri';
  access_log /out/proxy-access.log proof;
  map $http_authorization $has_auth { default 1; '' 0; }
  map $args $is_preview { default 0; ~*(preview|draft)=true 1; }
  server {
    listen 8080;
    location /api/v1/deliver/page/ {
      proxy_pass http://lumibase-rc2-bench-cms:1989;
      proxy_cache delivery;
      proxy_cache_key "$scheme$proxy_host$request_uri";
      proxy_cache_bypass $has_auth $is_preview;
      proxy_no_cache $has_auth $is_preview;
      proxy_cache_lock on;
      add_header X-Benchmark-Cache $upstream_cache_status always;
    }
    location / { proxy_pass http://lumibase-rc2-bench-cms:1989; }
  }
}
