packages:
  - "apps/*"
  # apps/marketplace is a git submodule (private lumibase-ai/marketplace) that
  # builds independently from the main repo with its own dependencies. Excluding
  # it from the workspace keeps the root pnpm-lock.yaml free of its deps, so a
  # frozen install here never depends on the submodule being checked out. CI
  # installs & builds it standalone inside apps/marketplace instead.
  - "!apps/marketplace"
  - "packages/*"

# pnpm 10+ reads install settings from THIS file, not from the `pnpm` key in
# package.json — it emits one `[WARN]` line and then ignores that key. The
# repo pins pnpm 9, which reads only package.json, so both copies exist on
# purpose during the transition (#295).
#
# Dropping either side is a silent failure, not an error: the security
# overrides revert to whatever transitive ranges ask for, the gray-matter
# patch disappears (js-yaml 4 has no `safeLoad`, so apps/docs front-matter
# parsing crashes), and the audit ignore stops applying. `pnpm settings:check`
# fails the build when the two drift apart.
#
# Justification + removal trigger for every entry below:
#   docs/en/security/dependency-overrides.md

overrides:
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.5"
  "brace-expansion@1": "^1.1.16"
  "brace-expansion@5": "^5.0.8"
  "dompurify": "^3.4.13"
  "esbuild": "^0.28.2"
  "fast-uri": "4.1.3"
  "form-data": "^4.0.6"
  "js-yaml": "^4.3.1"
  "nanoid@3": "^3.3.17"
  "postcss": "^8.5.26"
  "sharp": ">=0.35.0"
  "undici": "^7.28.0"
  "uuid": "^14.0.1"
  "vite": "^8.2.0"
  "ws": "^8.21.3"

patchedDependencies:
  "gray-matter@4.0.3": "patches/gray-matter@4.0.3.patch"

auditConfig:
  ignoreGhsas:
    - "GHSA-qwww-vcr4-c8h2"
