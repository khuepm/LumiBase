{{- if .Values.worker.enabled }}
{{- $component := dict "ctx" . "component" "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lumibase.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lumibase.componentLabels" $component | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "lumibase.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lumibase.selectorLabels" $component | nindent 8 }}
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include "lumibase.secretChecksum" . }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "lumibase.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.cms.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.cms.terminationGracePeriodSeconds }}
      {{- if ne .Values.migrations.mode "none" }}
      initContainers:
        # Queue consumers and the scheduler must not run on an older schema:
        # wait (read-only) until whoever migrates (the web pods' init
        # containers, the migration Job or the web entrypoint) has applied
        # every migration this image bundles.
        {{- include "lumibase.migrationsReadyContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "lumibase.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: health
              containerPort: {{ .Values.worker.healthPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "lumibase.fullname" . }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "lumibase.cmsSecretEnv" . | trim | nindent 12 }}
            - name: LUMIBASE_PROCESS_ROLE
              value: worker
            - name: LUMIBASE_WORKER_HEALTH_PORT
              value: {{ .Values.worker.healthPort | quote }}
            # A worker never migrates; its init container waits for the schema.
            - name: SKIP_MIGRATIONS
              value: "true"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.cms.securityContext | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "lumibase.tmpVolume" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
