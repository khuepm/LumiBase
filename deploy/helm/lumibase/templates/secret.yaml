{{- include "lumibase.validate" . -}}
{{- /*
Chart-managed Secret. Each value is, in order: the explicit value from
values.yaml, else the value already stored in this Secret (`lookup`, so a
`helm upgrade` keeps generated secrets stable), else a newly generated one.
Generated values are never written back into values, so nothing secret ends
up in a file you commit.

`lookup` returns nothing under `helm template` / `--dry-run` and in GitOps
tools that render that way; use secrets.existingSecret there.
*/ -}}
{{- $name := include "lumibase.secretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $data := dict -}}
{{- if and $existing $existing.data -}}
{{- $data = $existing.data -}}
{{- end -}}
{{- $out := dict -}}
{{- if not .Values.secrets.existingSecret -}}
{{- $_ := set $out "JWT_SECRET" (ternary (.Values.secrets.jwtSecret | b64enc) (default (randAlphaNum 64 | b64enc) (get $data "JWT_SECRET")) (not (empty .Values.secrets.jwtSecret))) -}}
{{- /* randBytes returns standard padded base64 of N random bytes: an AES-256 key the server accepts. */ -}}
{{- $_ := set $out "ENCRYPTION_KEY" (ternary (.Values.secrets.encryptionKey | trim | b64enc) (default (randBytes 32 | b64enc) (get $data "ENCRYPTION_KEY")) (not (empty .Values.secrets.encryptionKey))) -}}
{{- end -}}
{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
{{- $_ := set $out "postgres-password" (ternary (.Values.postgresql.auth.password | b64enc) (default (randAlphaNum 32 | b64enc) (get $data "postgres-password")) (not (empty .Values.postgresql.auth.password))) -}}
{{- end -}}
{{- if and (not .Values.postgresql.enabled) .Values.database.external.url (not .Values.database.external.existingSecret) -}}
{{- $_ := set $out "DATABASE_URL" (.Values.database.external.url | b64enc) -}}
{{- end -}}
{{- if and .Values.database.systemUrl.value (not .Values.database.systemUrl.existingSecret) -}}
{{- $_ := set $out "DATABASE_SYSTEM_URL" (.Values.database.systemUrl.value | b64enc) -}}
{{- end -}}
{{- if and .Values.redis.enabled (not .Values.redis.auth.existingSecret) -}}
{{- $_ := set $out "redis-password" (ternary (.Values.redis.auth.password | b64enc) (default (randAlphaNum 32 | b64enc) (get $data "redis-password")) (not (empty .Values.redis.auth.password))) -}}
{{- end -}}
{{- if and (not .Values.redis.enabled) .Values.redis.external.url (not .Values.redis.external.existingSecret) -}}
{{- $_ := set $out "REDIS_URL" (.Values.redis.external.url | b64enc) -}}
{{- end -}}
{{- if .Values.meilisearch.enabled -}}
{{- $_ := set $out "MEILISEARCH_API_KEY" (ternary (.Values.meilisearch.masterKey | b64enc) (default (randAlphaNum 32 | b64enc) (get $data "MEILISEARCH_API_KEY")) (not (empty .Values.meilisearch.masterKey))) -}}
{{- else if and .Values.meilisearch.external.apiKey (not .Values.meilisearch.external.existingSecret) -}}
{{- $_ := set $out "MEILISEARCH_API_KEY" (.Values.meilisearch.external.apiKey | b64enc) -}}
{{- end -}}
{{- if and .Values.s3.endpoint (not .Values.s3.existingSecret) -}}
{{- $_ := set $out "S3_ACCESS_KEY" (.Values.s3.accessKey | b64enc) -}}
{{- $_ := set $out "S3_SECRET_KEY" (.Values.s3.secretKey | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lumibase.labels" . | nindent 4 }}
  {{- if .Values.secrets.keepOnUninstall }}
  annotations:
    # ENCRYPTION_KEY lives here; deleting it on uninstall would make data
    # encrypted under it unreadable after a reinstall.
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $key, $value := $out }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
