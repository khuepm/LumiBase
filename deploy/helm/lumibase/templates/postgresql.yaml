{{- if .Values.postgresql.enabled }}
{{- $name := include "lumibase.postgresql.fullname" . -}}
{{- $component := dict "ctx" . "component" "postgresql" -}}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lumibase.componentLabels" $component | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "lumibase.selectorLabels" $component | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lumibase.componentLabels" $component | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "lumibase.selectorLabels" $component | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lumibase.selectorLabels" $component | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $pg.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag }}
          imagePullPolicy: {{ $pg.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            {{- include "lumibase.secretEnv" (dict "env" "POSTGRES_PASSWORD" "secret" (default (include "lumibase.secretName" .) $pg.auth.existingSecret) "key" (ternary $pg.auth.existingSecretKey "postgres-password" (not (empty $pg.auth.existingSecret)))) | nindent 12 }}
            # A subdirectory, so initdb does not trip over lost+found on a
            # freshly formatted volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            {{- toYaml $pg.securityContext | nindent 12 }}
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if not $pg.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "lumibase.selectorLabels" $component | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $pg.persistence.accessModes | nindent 10 }}
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
{{- end }}
