# Fly.io — LumiBase CMS + Studio (#741)
#
#   fly launch --from https://github.com/khuepm/lumibase --no-deploy
#
# Fly has no deploy button and generates no secrets, and its Postgres and
# Redis are separate resources. The database and Redis are each one command;
# the two application secrets are one more. Nothing secret is in this file:
#
#   fly postgres attach <your-postgres-app>          # sets DATABASE_URL
#   fly secrets set REDIS_URL=<url from `fly redis create`> \
#     JWT_SECRET="$(openssl rand -base64 48)" \
#     ENCRYPTION_KEY="$(openssl rand -base64 32)"
#   fly deploy
#
# A machine started without any of them exits at once, naming the missing
# variable, before it touches the database (docker/scripts/entrypoint.mjs).
# CORS_ALLOWED_ORIGINS defaults to https://<app>.fly.dev from FLY_APP_NAME.
#
# Then open https://<app>.fly.dev/setup and paste the `SETUP_TOKEN=` line from
# `fly logs`. Full walkthrough: docs/en/deployment/one-click.md.

# `fly launch` replaces this with the name you choose.
app = "lumibase"
primary_region = "iad"
# Fly's default is SIGINT, which the server does not trap: it would die
# mid-request instead of draining connections and closing its pools.
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  # UNATTENDED UPGRADES: `latest` follows the newest release and the image
  # migrates the database on every start, so a deploy or restart after a
  # (major) release upgrades this app. For production, change this one line
  # to the release you tested:  image = "ghcr.io/khuepm/lumibase-cms:<version>"
  # (`latest` stays the default because no older release tag has the
  # entrypoint these templates rely on; docs/en/deployment/one-click.md).
  image = "ghcr.io/khuepm/lumibase-cms:latest"

[env]
  NODE_ENV = "production"
  LUMIBASE_ENV = "production"
  LUMIBASE_RUNTIME = "docker"
  PORT = "1989"
  # The app is public before anyone has set it up; without the token,
  # whoever reaches /setup first owns it.
  LUMIBASE_REQUIRE_SETUP_TOKEN = "true"
  # `fly postgres attach` hands over a URL on Fly's private WireGuard network
  # with sslmode=disable. Use `require` for a database outside Fly.
  DATABASE_SSL_MODE = "disable"

[http_service]
  internal_port = 1989
  force_https = true
  # This process also runs the scheduler, sweeps and queue workers; a stopped
  # machine runs none of them. Keep one machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
