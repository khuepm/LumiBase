name: Deploy Pages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy (for example v0.4.2). Defaults to the selected ref."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages-deploy-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  WRANGLER_SEND_METRICS: "false"
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  deploy:
    name: Build and deploy Pages apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_TAG must match vX.Y.Z, got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package versions
        run: pnpm version:check

      - name: Export build metadata
        run: |
          VERSION="${RELEASE_TAG#v}"
          COMMIT_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${COMMIT_SHA::7}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          {
            echo "LUMIBASE_VERSION=$VERSION"
            echo "LUMIBASE_RELEASE_TAG=$RELEASE_TAG"
            echo "LUMIBASE_COMMIT_SHA=$COMMIT_SHA"
            echo "LUMIBASE_SHORT_SHA=$SHORT_SHA"
            echo "LUMIBASE_BUILD_TIME=$BUILD_TIME"
            echo "NEXT_PUBLIC_LUMIBASE_VERSION=$VERSION"
            echo "NEXT_PUBLIC_LUMIBASE_RELEASE_TAG=$RELEASE_TAG"
            echo "NEXT_PUBLIC_LUMIBASE_COMMIT_SHA=$COMMIT_SHA"
            echo "NEXT_PUBLIC_LUMIBASE_SHORT_SHA=$SHORT_SHA"
            echo "NEXT_PUBLIC_LUMIBASE_BUILD_TIME=$BUILD_TIME"
            echo "VITE_LUMIBASE_VERSION=$VERSION"
            echo "VITE_LUMIBASE_RELEASE_TAG=$RELEASE_TAG"
            echo "VITE_LUMIBASE_COMMIT_SHA=$COMMIT_SHA"
            echo "VITE_LUMIBASE_SHORT_SHA=$SHORT_SHA"
            echo "VITE_LUMIBASE_BUILD_TIME=$BUILD_TIME"
          } >> "$GITHUB_ENV"

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare Pages deployment because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy docs to Cloudflare Pages
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        id: deploy_docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler pages deploy dist --project-name lumibase-docs --branch main --cwd apps/docs 2>&1 | tee docs-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+' docs-deploy.log | tail -n1 | sed 's/[),.]*$//')"
          if [ -z "$URL" ]; then
            echo "Failed to parse docs deployment URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify docs deployment
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        env:
          DOCS_URL: ${{ steps.deploy_docs.outputs.url }}
        run: |
          set -euo pipefail
          base="${DOCS_URL%/}"

          # 1. Homepage must load.
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 \
            --max-time 20 "$base" --output /dev/null

          # 2. SPA deep-link refresh must NOT 404. A path that is intentionally
          #    not prerendered exercises the _redirects SPA fallback
          #    (/* /index.html 200). If that fallback is missing from the
          #    deployed output, direct loads / refreshes of every route return
          #    404 — so fail the deploy here instead of shipping it.
          probe="$base/en/docs/__spa-fallback-probe__"
          status="$(curl --silent --show-error --location --retry 5 --retry-delay 5 \
            --max-time 20 --output /dev/null --write-out '%{http_code}' "$probe")"
          if [ "$status" != "200" ]; then
            echo "SPA deep-link refresh returned HTTP $status for $probe (expected 200)." >&2
            echo "The _redirects SPA fallback is not being served — direct page refreshes will 404." >&2
            exit 1
          fi
          echo "SPA deep-link fallback OK ($probe -> $status)."

      - name: Build landing
        run: pnpm landing:build

      - name: Deploy landing to Cloudflare Pages
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        id: deploy_landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler pages deploy apps/landing/out --project-name lumibase-landing --branch main 2>&1 | tee landing-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+' landing-deploy.log | tail -n1 | sed 's/[),.]*$//')"
          if [ -z "$URL" ]; then
            echo "Failed to parse landing deployment URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify landing deployment
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 20 "${{ steps.deploy_landing.outputs.url }}" --output /dev/null

      - name: Build marketplace
        run: pnpm marketplace:build

      - name: Deploy marketplace to Cloudflare Pages
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        id: deploy_marketplace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler pages deploy apps/marketplace/out --project-name lumibase-marketplace --branch main 2>&1 | tee marketplace-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+' marketplace-deploy.log | tail -n1 | sed 's/[),.]*$//')"
          if [ -z "$URL" ]; then
            echo "Failed to parse marketplace deployment URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify marketplace deployment
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 20 "${{ steps.deploy_marketplace.outputs.url }}" --output /dev/null

      - name: Build studio
        env:
          # The Studio is a static SPA with no co-located backend on
          # Cloudflare Pages, so it must call the CMS cross-origin. Point it
          # at the deployed CMS origin (the same repo variable the CMS deploy
          # verifies against). The CMS must allow this Studio origin via
          # CORS_ALLOWED_ORIGINS. If unset, the build falls back to
          # same-origin and the Studio will fail to reach the API.
          VITE_API_URL: ${{ vars.LUMIBASE_CMS_PRODUCTION_URL }}
        run: pnpm --filter @lumibase/studio build

      - name: Deploy studio to Cloudflare Pages
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        id: deploy_studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm exec wrangler pages deploy apps/studio/dist --project-name lumibase-studio --branch main 2>&1 | tee studio-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+' studio-deploy.log | tail -n1 | sed 's/[),.]*$//')"
          if [ -z "$URL" ]; then
            echo "Failed to parse studio deployment URL" >&2
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Ensure Studio custom domain
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotently attach the production Studio domain to the Pages project
        # so studio.lumibase.dev resolves (Cloudflare provisions the proxied DNS
        # record). The CMS API lives on the separate api.lumibase.dev origin,
        # which the Worker owns via wrangler `custom_domain`.
        run: node scripts/ensure-pages-domain.mjs --project lumibase-studio --domain studio.lumibase.dev

      - name: Verify studio deployment
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --max-time 20 "${{ steps.deploy_studio.outputs.url }}" --output /dev/null

      - name: Add deployment URLs to GitHub Release notes
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_URL: ${{ steps.deploy_docs.outputs.url }}
          LANDING_URL: ${{ steps.deploy_landing.outputs.url }}
          MARKETPLACE_URL: ${{ steps.deploy_marketplace.outputs.url }}
          STUDIO_URL: ${{ steps.deploy_studio.outputs.url }}
        run: |
          cat > deployment-notes.md <<EOF_NOTES
          <!-- lumibase-pages-deployments:start -->
          ## Cloudflare Pages deployments

          - Docs: ${DOCS_URL}
          - Landing: ${LANDING_URL}
          - Marketplace: ${MARKETPLACE_URL}
          - Studio: ${STUDIO_URL}
          <!-- lumibase-pages-deployments:end -->
          EOF_NOTES

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json body --jq .body > current-release-notes.md
            python3 <<'PY'
          from pathlib import Path
          import re

          current = Path("current-release-notes.md").read_text().rstrip()
          block = Path("deployment-notes.md").read_text().strip()
          pattern = re.compile(
              r"<!-- lumibase-pages-deployments:start -->.*?<!-- lumibase-pages-deployments:end -->",
              re.S,
          )

          if pattern.search(current):
              updated = pattern.sub(block, current)
          elif current:
              updated = f"{current}\n\n{block}"
          else:
              updated = block

          Path("updated-release-notes.md").write_text(updated + "\n")
          PY
            gh release edit "$RELEASE_TAG" --notes-file updated-release-notes.md
          else
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file deployment-notes.md
          fi
