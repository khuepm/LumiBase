name: Helm chart

# Lint and render-test the chart on every change to it, and install it into a
# kind cluster with the image built from the same commit (#742): the chart
# depends on the image's entrypoint, migration runner, health routes and env
# contract, so a change on either side is tested against the other.
on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "docker/Dockerfile"
      - "docker/scripts/**"
      - "apps/cms/src/serve.ts"
      - "apps/cms/src/serve-studio.ts"
      - "apps/cms/src/worker-health.ts"
      - "apps/cms/src/config/**"
      - "apps/cms/src/routes/health.ts"
      - "packages/database/scripts/migrate.ts"
      - "packages/database/src/migration-runner.ts"
      - "packages/database/src/migration-guard.ts"
      - "packages/database/drizzle/**"
      - "scripts/helm-kind-smoke.sh"
      - "scripts/install-image-tools.sh"
      - "scripts/__tests__/helm-chart.test.mjs"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "docker/Dockerfile"
      - "docker/scripts/**"
      - "apps/cms/src/serve.ts"
      - "apps/cms/src/serve-studio.ts"
      - "apps/cms/src/worker-health.ts"
      - "apps/cms/src/config/**"
      - "apps/cms/src/routes/health.ts"
      - "packages/database/scripts/migrate.ts"
      - "packages/database/src/migration-runner.ts"
      - "packages/database/src/migration-guard.ts"
      - "packages/database/drizzle/**"
      - "scripts/helm-kind-smoke.sh"
      - "scripts/install-image-tools.sh"
      - "scripts/__tests__/helm-chart.test.mjs"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and render tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm
        run: scripts/install-image-tools.sh helm

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: helm lint (CI values and an ingress/TLS production shape)
        run: |
          set -euo pipefail
          helm lint deploy/helm/lumibase -f deploy/helm/lumibase/ci/kind-values.yaml --strict
          helm lint deploy/helm/lumibase --strict \
            --set ingress.enabled=true --set 'ingress.hosts[0].host=cms.example.com' \
            --set 'ingress.tls[0].hosts[0]=cms.example.com' --set 'ingress.tls[0].secretName=cms-tls' \
            --set postgresql.enabled=false --set database.external.existingSecret=db \
            --set redis.enabled=false --set redis.external.existingSecret=redis \
            --set secrets.existingSecret=lumibase-app --set autoscaling.enabled=true

      # Renders the chart with many value sets and asserts on the parsed YAML;
      # HELM_REQUIRED turns "helm not installed → skip" into a failure here.
      - name: Render tests
        env:
          HELM_REQUIRED: "1"
        run: node --test scripts/__tests__/helm-chart.test.mjs

  kind-smoke:
    name: kind smoke test (install, helm test, schema upgrade)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Helm and kind
        run: scripts/install-image-tools.sh helm kind

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: lumibase-cms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the chart on kind and check health
        env:
          IMAGE: lumibase-cms:ci
        run: scripts/helm-kind-smoke.sh
