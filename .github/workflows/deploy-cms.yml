name: Deploy CMS

# Non-production CMS Worker deploys. Production (tag vX.Y.Z) is owned by
# release.yml, so this workflow intentionally does NOT react to tags.
#
#   push to `dev`   → dev env     (lumibase-cms-dev,     dev.lumibase.dev/api/*)
#   push to `main`  → staging env (lumibase-cms-staging, staging.lumibase.dev/api/*)
#   workflow_dispatch → choose dev | staging | demo (demo has no branch trigger)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target CMS environment"
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - demo
  push:
    branches: [dev, main]

concurrency:
  group: deploy-cms-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  resolve-env:
    name: Resolve target environment
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.pick.outputs.target }}
    steps:
      - name: Pick environment
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            TARGET="dev"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="staging"
          else
            echo "::error::No CMS environment mapping for ref ${{ github.ref }}."
            exit 1
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Deploying CMS to: ${TARGET}"

  deploy:
    name: Deploy CMS (${{ needs.resolve-env.outputs.target }})
    needs: resolve-env
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub environment for protection rules / scoped secrets. dev and demo
    # fall back to the `staging` GitHub environment unless you create matching
    # GitHub environments named "dev"/"demo".
    environment: ${{ needs.resolve-env.outputs.target == 'demo' && 'demo' || (needs.resolve-env.outputs.target == 'dev' && 'dev' || 'staging') }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_ENV: ${{ needs.resolve-env.outputs.target }}
      LUMIBASE_RELEASE_CHANNEL: ${{ needs.resolve-env.outputs.target }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject build metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/cms/package.json').version")"
          {
            echo "LUMIBASE_VERSION=${VERSION}"
            echo "LUMIBASE_GIT_SHA=${GITHUB_SHA::12}"
            echo "LUMIBASE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"

      - name: Typecheck CMS
        run: pnpm --filter @lumibase/cms typecheck

      - name: Test CMS
        run: pnpm --filter @lumibase/cms test

      - name: Build CMS
        run: pnpm --filter @lumibase/cms run build:${TARGET_ENV}

      - name: Check Cloudflare deploy credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${TARGET_ENV} deploy because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured for this environment."
          fi

      - name: Deploy CMS
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: pnpm --filter @lumibase/cms run deploy:${TARGET_ENV}

      - name: Verify deployment health
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://${TARGET_ENV}.lumibase.dev"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}/health" > /tmp/lumibase-cms-health.json

          VERSION_JSON="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}/api/v1/system/version")"
          RUNNING_CHANNEL="$(node -e "const d = JSON.parse(process.argv[1]); console.log(d.releaseChannel ?? '')" "$VERSION_JSON")"
          test "$RUNNING_CHANNEL" = "$TARGET_ENV"
