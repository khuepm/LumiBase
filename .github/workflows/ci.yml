name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Version, typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"
          mkdir -p .turbo

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package versions
        run: pnpm version:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  lint-allowlist:
    name: Lint stable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"
          mkdir -p .turbo

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-lint-
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint allowlisted packages
        run: pnpm --filter @lumibase/landing --filter @lumibase/marketplace --filter @lumibase/studio --filter @lumibase/docs --filter @lumibase/cms lint

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.12.0
          run_install: false

      # Report the full audit for visibility (never fails the build) …
      - name: Audit (report, non-blocking)
        run: pnpm audit --prod || true

      # … then fail only on HIGH/CRITICAL advisories so a known-exploitable
      # dependency blocks the merge while noisy low/moderate transitive
      # advisories do not (CWE-1104).
      - name: Audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high
