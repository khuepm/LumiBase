name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Version, typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"
          mkdir -p .turbo

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # One aggregate step so the local pre-commit hook and CI cannot drift
      # apart: `.husky/pre-commit` runs this same `pnpm check:all`. Adding a
      # guard to the script therefore arms it in both places at once. Covers
      # version:check, registry:check, settings:check, drift:check, scripts:test.
      #
      # Why each one earns its place:
      #  - settings:check — pnpm 9 reads install settings from package.json;
      #    pnpm 10+ reads them from pnpm-workspace.yaml. Both copies exist
      #    during the transition (#295), so fail fast when they drift instead
      #    of discovering it as a wall of audit failures after a pnpm bump.
      #  - drift:check — an override applies to direct dependencies too, so it
      #    can silently overrule what a manifest declares: `overrides.vite` sat
      #    at ^7.3.5 while apps/studio and apps/docs declared ^8.1.3, and both
      #    shipped Vite 7 builds under manifests claiming Vite 8. The parity
      #    check cannot see this — the two override copies agreed with each
      #    other, they were only both wrong relative to the manifests.
      - name: Check repo guards (versions, registry, pnpm settings, override drift, scripts)
        run: pnpm check:all

      # `pnpm -r` runs tsc in every workspace package directly — no turbo cache
      # in between — so a stale cache can never mask a type error on CI.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e-golden-path:
    name: E2E golden path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # v1 release criteria §3: the content happy path must never be verified by
    # hand. Boots the CMS against a real Postgres and drives, over HTTP through
    # the full middleware stack: setup wizard → create collection → create item
    # → publish → read back, plus a two-site tenant-isolation check.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumibase
          POSTGRES_PASSWORD: lumibase_ci
          POSTGRES_DB: lumibase
        ports:
          - 5432:5432
        # Gate the job start on the DB actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U lumibase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The docker runtime uses Redis for cache + the BullMQ queue; the login
      # and audit paths enqueue work, so a reachable Redis is required or those
      # awaits stall. Provide one rather than mock the runtime.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lumibase:lumibase_ci@localhost:5432/lumibase
      REDIS_URL: redis://localhost:6379
      LUMIBASE_RUNTIME: docker
      LUMIBASE_ENV: development
      # Non-secret CI-only signing key: the test logs in as the bootstrap admin
      # and reuses the returned JWT. Never a real deployment secret.
      JWT_SECRET: ci_e2e_golden_path_secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"
          mkdir -p .turbo

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @lumibase/database migrate

      - name: Run golden-path E2E
        run: pnpm --filter @lumibase/cms exec vitest --run src/__tests__/golden-path.e2e.test.ts

      # v1 release criteria §4: the 0.x → 1.0 upgrade path must be tested for
      # real, not verified by hand. Seeds a pre-policy (0.6.x-shape) RBAC
      # fixture and runs the actual role→policy backfill + documented
      # post-check against the same Postgres. Sequential with the golden-path
      # step on purpose — both suites share the database.
      - name: Run upgrade-path E2E (0.x → 1.0 RBAC backfill)
        run: pnpm --filter @lumibase/cms exec vitest --run src/__tests__/upgrade-path.e2e.test.ts

  db-integration:
    name: DB integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The 19 `*.db.integration.test.ts` suites self-skip without DATABASE_URL,
    # so before this job existed they were green-by-absence in CI: `pnpm test`
    # in `checks` has no database, every one of them skipped, and nothing they
    # assert could ever fail a PR. They ran only on a developer's machine.
    #
    # A separate job rather than adding services to `checks`: vitest turns off
    # file parallelism whenever DATABASE_URL is set (see apps/cms/vitest.config.ts
    # — the suites share one database and reset shared tables), so folding them
    # into `checks` would serialize the whole 2400-test suite on every PR. Here
    # the cost runs alongside `checks` instead of on top of it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumibase
          POSTGRES_PASSWORD: lumibase_ci
          POSTGRES_DB: lumibase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumibase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Same reason as the E2E job: the login and audit paths enqueue work
      # through Redis, so suites that touch them stall or 500 without one.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lumibase:lumibase_ci@localhost:5432/lumibase
      REDIS_URL: redis://localhost:6379
      LUMIBASE_RUNTIME: docker
      LUMIBASE_ENV: development
      # Non-secret CI-only signing key — several auth suites read it off c.env.
      JWT_SECRET: ci_db_integration_secret
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @lumibase/database migrate

      # Fail loudly if the filter stops matching. A rename that made this
      # select zero files would otherwise reproduce exactly the silence this
      # job exists to end.
      - name: Assert the integration suites are discoverable
        run: |
          count=$(find apps/cms/src -name '*.integration.test.ts' | wc -l)
          echo "found $count integration suite(s)"
          test "$count" -ge 20

      - name: Run integration suites against Postgres
        run: pnpm --filter @lumibase/cms exec vitest --run integration

  lint-allowlist:
    name: Lint stable packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `secrets` context is not allowed in step-level `if:`, so surface the token's
    # presence as an env var the steps below can gate on.
    env:
      MARKETPLACE_SUBMODULE_TOKEN: ${{ secrets.MARKETPLACE_SUBMODULE_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # marketplace (apps/marketplace) lives in the private lumibase-ai/marketplace
      # repo; without it the `--filter @lumibase/marketplace` lint target resolves
      # to an empty directory and pnpm silently skips it. The runner's GITHUB_TOKEN
      # can't read another org's repo, so authenticate with the
      # MARKETPLACE_SUBMODULE_TOKEN PAT via a scoped insteadOf rewrite. Init ONLY
      # this path — enterprise/extensions are private too and a blanket
      # `submodules: true` checkout would abort with "repository not found".
      #
      # Dependabot runs and forked-PR runs do NOT receive repository secrets, so
      # the token is empty there and the private clone would fail. Skip the fetch
      # (and the marketplace lint below) in that case — the workspace packages
      # still lint fine without it.
      - name: Fetch marketplace submodule
        if: ${{ env.MARKETPLACE_SUBMODULE_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${MARKETPLACE_SUBMODULE_TOKEN}@github.com/lumibase-ai/".insteadOf "https://github.com/lumibase-ai/"
          git submodule update --init --depth=1 apps/marketplace
          git config --global --unset url."https://x-access-token:${MARKETPLACE_SUBMODULE_TOKEN}@github.com/lumibase-ai/".insteadOf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Prepare cache directories
        shell: bash
        run: |
          mkdir -p "${{ steps.pnpm-store.outputs.path }}"
          mkdir -p .turbo

      - name: Restore pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-pnpm-

      - name: Restore Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-lint-
            ${{ runner.os }}-node${{ env.NODE_VERSION }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint allowlisted packages
        run: pnpm --filter @lumibase/landing --filter @lumibase/studio --filter @lumibase/docs --filter @lumibase/cms lint

      # marketplace is excluded from the pnpm workspace (see pnpm-workspace.yaml),
      # so a root `--filter @lumibase/marketplace` never matches — it must be
      # linted standalone with its own deps, exactly as pages-deploy.yml builds
      # it. The Fetch marketplace submodule step above makes its source present.
      - name: Lint marketplace (standalone submodule)
        if: ${{ env.MARKETPLACE_SUBMODULE_TOKEN != '' }}
        working-directory: apps/marketplace
        run: |
          pnpm install --no-frozen-lockfile --ignore-workspace
          pnpm lint

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.0
          run_install: false

      # Report the full audit for visibility (never fails the build) …
      - name: Audit (report, non-blocking)
        run: pnpm audit --prod || true

      # … then fail only on HIGH/CRITICAL advisories so a known-exploitable
      # dependency blocks the merge while noisy low/moderate transitive
      # advisories do not (CWE-1104).
      #
      # Advisories deliberately excluded from this gate live in
      # `auditConfig.ignoreGhsas` — declared in BOTH root package.json (pnpm 9)
      # and pnpm-workspace.yaml (pnpm 10+), kept in step by
      # `pnpm settings:check`. Each entry needs a
      # written justification + revisit trigger in the "Audit ignore registry"
      # of `docs/en/security/dependency-overrides.md` — never add one just to
      # make CI green.
      - name: Audit (fail on high/critical)
        run: pnpm audit --prod --audit-level high

  workflow-lint:
    name: Workflow files are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A workflow file with an invalid expression does not degrade gracefully:
    # GitHub cannot parse it, so it never resolves `name:` or any job, and it
    # records a bare failed run against whatever event fired. `perf-k6.yml`
    # sat in exactly that state for weeks — `env.PERF_K6_FULL_RUN` in a
    # job-level `if:`, where the `env` context is not available — failing on
    # every single push. Nothing was watching, because nothing lints the
    # workflows themselves. This job is that watcher.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned by version AND checksum rather than pulling a third-party
      # action: one fewer `uses:` SHA to keep current, and the binary is
      # verified before it runs.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.10
          ACTIONLINT_SHA256: f4c76b71db5755a713e6055cbb0857ed07e103e028bda117817660ebadb4386f
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar xzf actionlint.tar.gz actionlint
          ./actionlint --version

      # shellcheck/pyflakes are left on: `run:` blocks here drive Postgres,
      # Redis and deploy steps, and a quoting bug in one of those is the same
      # class of silent breakage.
      - name: Lint workflow files
        run: ./actionlint
