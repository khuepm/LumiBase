name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag matches root package version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
            throw new Error(`Release tag ${tag} must match v<major>.<minor>.<patch>.`);
          }

          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedTag = `v${version}`;
          if (tag !== expectedTag) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}; expected ${expectedTag}.`);
          }

          console.log(`Release tag ${tag} matches package.json version ${version}.`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check package versions
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          awk -v version="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" version "\\]") {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..${tag}"
              echo "Changes since ${previous_tag}:" > release-notes.md
            else
              range="$tag"
              echo "Changes included in ${tag}:" > release-notes.md
            fi
            echo >> release-notes.md
            git log --pretty=format:'- %s (%h)' "$range" >> release-notes.md
            echo >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LumiBase ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  deploy-cloudflare-worker-cms:
    name: Deploy Cloudflare Worker CMS
    runs-on: ubuntu-latest
    needs: github-release
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CMS Worker deployment because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi

      - name: Deploy CMS Worker
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: pnpm --filter @lumibase/cms run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}


  deploy-cloudflare-pages-apps:
    name: Deploy Cloudflare Pages apps (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    needs: github-release
    timeout-minutes: 25
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: docs
            package: "@lumibase/docs"
            output: apps/docs/dist
            project: lumibase-docs
          - name: landing
            package: "@lumibase/landing"
            output: apps/landing/out
            project: lumibase-landing
          - name: marketplace
            package: "@lumibase/marketplace"
            output: apps/marketplace/out
            project: lumibase-marketplace
          - name: studio
            package: "@lumibase/studio"
            output: apps/studio/dist
            project: lumibase-studio
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Pages app
        run: pnpm --filter ${{ matrix.app.package }} build

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages deployment because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi

      - name: Deploy Pages app
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: pnpm exec wrangler pages deploy "${{ matrix.app.output }}" --project-name "${{ matrix.app.project }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-docker-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: github-release
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set IMAGE_NAME
        run: |
          echo "IMAGE_NAME=khuepm/lumibase-cms" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm-packages:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: github-release
    if: ${{ vars.PUBLISH_NPM_PACKAGES == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check npm token
        id: check_token
        shell: bash
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping npm package publishing because NPM_TOKEN is not configured."
          fi

      - name: Build packages
        if: steps.check_token.outputs.has_token == 'true'
        run: pnpm --filter "./packages/**" build

      - name: Publish public packages
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const packages = fs.readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => ({ dir: `packages/${entry.name}`, path: `packages/${entry.name}/package.json` }))
            .filter(({ path }) => fs.existsSync(path))
            .map(({ dir, path }) => ({ dir, manifest: JSON.parse(fs.readFileSync(path, 'utf8')) }))
            .filter(({ manifest }) => manifest.private !== true);

          if (packages.length === 0) {
            console.log('No public packages to publish.');
            process.exit(0);
          }

          const failures = [];
          for (const { dir, manifest } of packages) {
            const id = `${manifest.name}@${manifest.version}`;
            console.log(`Publishing ${id} from ${dir}...`);
            // Run from the package dir: `pnpm --dir <path> publish` is broken on pnpm 9.x.
            // --provenance emits a signed attestation (the job has id-token: write).
            // Capture output so one package's failure does not abort the rest.
            const result = cp.spawnSync('pnpm', ['publish', '--access', 'public', '--no-git-checks', '--provenance'], {
              cwd: dir,
              encoding: 'utf8',
              env: process.env,
            });
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');

            if (result.status === 0) {
              console.log(`✓ Published ${id}`);
              continue;
            }

            // Idempotent re-run: the version is already on the registry.
            const output = `${result.stdout || ''}${result.stderr || ''}`;
            if (/cannot publish over|previously published version|EPUBLISHCONFLICT/i.test(output)) {
              console.log(`• Skipping ${id} (already published).`);
              continue;
            }

            console.error(`✗ Failed to publish ${id}`);
            failures.push(manifest.name);
          }

          if (failures.length > 0) {
            console.error(`npm publish failed for: ${failures.join(', ')}`);
            process.exit(1);
          }
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
