name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  LUMIBASE_RELEASE_CHANNEL: production

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag matches root package version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag)) {
            throw new Error(`Release tag ${tag} must be valid SemVer with a v prefix.`);
          }

          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expectedTag = `v${version}`;
          if (tag !== expectedTag) {
            throw new Error(`Release tag ${tag} does not match package.json version ${version}; expected ${expectedTag}.`);
          }

          console.log(`Release tag ${tag} matches package.json version ${version}.`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check package versions
        run: pnpm version:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The image vulnerability gate (#734) runs before anything is published.
  # Every publishing job — the GitHub Release, the Worker and Pages deploys,
  # the image push and npm — hangs off github-release, which needs this job,
  # so a CRITICAL finding (or a scanner that cannot fetch its database) stops
  # the whole release instead of leaving one without its Docker image.
  scan-docker-image:
    name: Scan Docker image (Trivy gate)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Trivy
        run: scripts/install-image-tools.sh trivy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # amd64 only: the gate scans the OS layer and the shipped files, which
      # are the same packages for both architectures. The cache it writes is
      # what publish-docker-image builds from, so the pushed amd64 image is
      # built from the layers scanned here.
      - name: Build image for scanning (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: lumibase-cms:release-scan
          build-args: |
            LUMIBASE_GIT_SHA=${{ github.sha }}
            LUMIBASE_RELEASE_CHANNEL=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two legs, because the image alone cannot show everything: the server is
      # an esbuild bundle, so its npm dependencies leave no package metadata in
      # the image for a scanner to read. The image scan covers the OS layer and
      # what ships unbundled (node-cron); the lockfile scan covers the bundled
      # npm dependencies. Exceptions go in .trivyignore with a reason.
      - name: Trivy gate — no CRITICAL vulnerabilities
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity CRITICAL --exit-code 1 --no-progress lumibase-cms:release-scan
          trivy fs --scanners vuln --severity CRITICAL --exit-code 1 --no-progress pnpm-lock.yaml

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, scan-docker-image]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          awk -v version="$version" '
            BEGIN { found = 0 }
            /^## \[/ {
              if (found) exit
              if ($0 ~ "^## \\[" version "\\]") {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              range="${previous_tag}..${tag}"
              echo "Changes since ${previous_tag}:" > release-notes.md
            else
              range="$tag"
              echo "Changes included in ${tag}:" > release-notes.md
            fi
            {
              echo
              git log --pretty=format:'- %s (%h)' "$range"
              echo
            } >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LumiBase ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  deploy-cloudflare-worker-cms:
    name: Deploy Cloudflare Worker CMS
    runs-on: ubuntu-latest
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping CMS Worker deployment because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi

      - name: Ensure production flow queues
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: node scripts/ensure-flow-queues.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy CMS Worker
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: pnpm --filter @lumibase/cms run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # v1 release criteria §3: the release itself must smoke-test the CF
      # target, not rely on the separate deploy-cms.yml workflow. Asserts the
      # production Worker is healthy AND actually serves the version being
      # released (with-build-metadata injects it at deploy time).
      - name: Verify Worker deployment health
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://api.lumibase.dev"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}/health" > /dev/null

          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_JSON="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
            "${BASE_URL}/api/v1/system/version")"
          RUNNING_VERSION="$(node -e "const d = JSON.parse(process.argv[1]); console.log(d.version ?? '')" "$VERSION_JSON")"
          if [ "$RUNNING_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Production Worker reports version ${RUNNING_VERSION}, expected ${EXPECTED_VERSION}."
            exit 1
          fi
          echo "Production Worker healthy at ${RUNNING_VERSION}."


  deploy-cloudflare-pages-apps:
    name: Deploy Cloudflare Pages apps (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    needs: github-release
    if: ${{ !contains(github.ref_name, '-') }}
    timeout-minutes: 25
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: docs
            package: "@lumibase/docs"
            output: apps/docs/dist
            project: lumibase-docs
          - name: landing
            package: "@lumibase/landing"
            output: apps/landing/out
            project: lumibase-landing
          - name: marketplace
            package: "@lumibase/marketplace"
            output: apps/marketplace/out
            project: lumibase-marketplace
          - name: studio
            package: "@lumibase/studio"
            output: apps/studio/dist
            project: lumibase-studio
    steps:
      - uses: actions/checkout@v7

      # Only the marketplace app needs its submodule so that
      # `pnpm --filter @lumibase/marketplace build` can produce apps/marketplace/out.
      # It lives in the private lumibase-ai/marketplace repo, which the runner's
      # GITHUB_TOKEN cannot read, so authenticate with the MARKETPLACE_SUBMODULE_TOKEN
      # PAT via a scoped insteadOf rewrite. Init ONLY this path — enterprise/extensions
      # are private too and a blanket `submodules: true` checkout would abort with
      # "repository not found".
      - name: Fetch marketplace submodule
        if: matrix.app.name == 'marketplace'
        env:
          MARKETPLACE_SUBMODULE_TOKEN: ${{ secrets.MARKETPLACE_SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MARKETPLACE_SUBMODULE_TOKEN}" ]; then
            echo "::error::MARKETPLACE_SUBMODULE_TOKEN is not configured; cannot fetch the private apps/marketplace submodule." >&2
            exit 1
          fi
          git config --global url."https://x-access-token:${MARKETPLACE_SUBMODULE_TOKEN}@github.com/lumibase-ai/".insteadOf "https://github.com/lumibase-ai/"
          git submodule update --init --depth=1 apps/marketplace
          git config --global --unset url."https://x-access-token:${MARKETPLACE_SUBMODULE_TOKEN}@github.com/lumibase-ai/".insteadOf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # marketplace is a standalone submodule excluded from the pnpm workspace,
      # so it installs & builds on its own (its deps are not in the root lockfile).
      - name: Build Pages app (marketplace, standalone)
        if: matrix.app.name == 'marketplace'
        working-directory: apps/marketplace
        run: |
          pnpm install --no-frozen-lockfile --ignore-workspace
          pnpm build

      - name: Build Pages app
        if: matrix.app.name != 'marketplace'
        # Both GA measurement IDs are inlined at build time (landing is a static
        # Next export, docs is a prerendered Vite SPA), so they have to be present
        # here rather than set at runtime. Each is read by one app only; unset
        # means that app ships no GA tag and no cookie banner.
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_API_URL: ${{ vars.LUMIBASE_CMS_PRODUCTION_URL }}
          APP_NAME: ${{ matrix.app.name }}
        run: |
          if [ "$APP_NAME" = studio ] && [ -z "$VITE_API_URL" ]; then
            echo "::error::LUMIBASE_CMS_PRODUCTION_URL is unset" >&2
            exit 1
          fi
          pnpm --filter ${{ matrix.app.package }} build

      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        shell: bash
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages deployment because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi

      - name: Deploy Pages app
        if: steps.cloudflare-credentials.outputs.can_deploy == 'true'
        run: pnpm exec wrangler pages deploy "${{ matrix.app.output }}" --project-name "${{ matrix.app.project }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish-docker-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: github-release
    # arm64 is built via QEMU emulation, which is markedly slower than the
    # native amd64 build — allow extra headroom over the amd64-only budget.
    timeout-minutes: 90
    permissions:
      # contents: write only to attach the SBOMs to this tag's GitHub Release.
      contents: write
      packages: write
      # Keyless cosign signing (#734): the workflow's OIDC identity is the
      # signing identity, so there is no long-lived signing key to store,
      # rotate or leak.
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set IMAGE_NAME
        run: |
          echo "IMAGE_NAME=khuepm/lumibase-cms" >> "$GITHUB_ENV"

      # Syft and cosign, each pinned by version and SHA-256. The Trivy gate
      # already passed in scan-docker-image, before the release was created.
      - name: Install image supply-chain tools
        run: scripts/install-image-tools.sh syft cosign

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LUMIBASE_GIT_SHA=${{ github.sha }}
            LUMIBASE_RELEASE_CHANNEL=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below addresses the image by digest, never by tag: a tag
      # can be moved after signing, a digest cannot.
      - name: Generate SBOMs
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          syft scan "registry:${IMAGE}" -o spdx-json=lumibase-cms-image.spdx.json
          syft scan file:pnpm-lock.yaml -o spdx-json=lumibase-dependencies.spdx.json

      - name: Sign image and attest SBOM (keyless)
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate lumibase-cms-image.spdx.json "$IMAGE"

      - name: Attach SBOMs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" lumibase-cms-image.spdx.json lumibase-dependencies.spdx.json --clobber

  # v1 release criteria §3: both deployment targets get smoke-tested on the
  # release itself. The Worker is verified post-deploy above; this job pulls
  # the exact image that was just pushed for this tag and asserts the Docker
  # path (serve.ts) boots and answers /health.
  smoke-docker-image:
    name: Smoke-test Docker image
    runs-on: ubuntu-latest
    needs: publish-docker-image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install cosign
        run: scripts/install-image-tools.sh cosign

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Verify what an operator would verify: the signature was made by THIS
      # repository's release workflow on a tag ref, through GitHub's OIDC
      # issuer. Fails the release if signing silently did not happen.
      - name: Verify image signature and SBOM attestation
        env:
          IMAGE: ${{ env.REGISTRY }}/khuepm/lumibase-cms@${{ needs.publish-docker-image.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          cosign verify-attestation "$IMAGE" --type spdxjson \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "Signature and SBOM attestation verified for $IMAGE"

      - name: Run released image health check
        timeout-minutes: 5
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/khuepm/lumibase-cms:${GITHUB_REF_NAME#v}"

          cleanup() {
            docker logs lumibase-release-smoke 2>/dev/null || true
            docker rm -f lumibase-release-smoke 2>/dev/null || true
          }
          trap cleanup EXIT

          docker pull "$IMAGE"
          # Same boot env as the docker.yml health check: /health only needs
          # the app up, not live backing services. Run exactly as the hardened
          # compose profile does (#734): read-only root filesystem, no
          # capabilities, no privilege escalation, /tmp as the only tmpfs.
          docker run -d --name lumibase-release-smoke \
            --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 1989:1989 \
            -e LUMIBASE_RUNTIME=docker \
            -e PORT=1989 \
            -e DATABASE_URL=postgresql://localhost:5432/lumibase \
            -e REDIS_URL=redis://localhost:6379 \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_ACCESS_KEY=minioadmin \
            -e S3_SECRET_KEY=minioadmin \
            -e S3_BUCKET=lumibase-media \
            -e MEILISEARCH_HOST=http://localhost:7700 \
            -e MEILISEARCH_API_KEY=test \
            -e IMGPROXY_URL=http://localhost:8080 \
            -e IMGPROXY_KEY=736563726574 \
            -e IMGPROXY_SALT=736563726574 \
            -e SKIP_MIGRATIONS=true \
            "$IMAGE"

          echo "Waiting for container to start..."
          sleep 5

          MAX_RETRIES=6
          RETRY_COUNT=0
          until curl --max-time 5 -sf http://localhost:1989/health > /dev/null 2>&1; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "Health check failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - waiting..."
            sleep 5
          done
          echo "Released Docker image healthy."

          # The image must report the version it was tagged with. Until
          # 1.0.0-rc.5 every image answered "unknown", which broke the
          # "determine your current version" step of the upgrade runbook
          # and the Studio footer, and nothing noticed.
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(curl --max-time 5 -fsS http://localhost:1989/api/v1/system/version | jq -r .version)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::/api/v1/system/version reports '$ACTUAL', expected '$EXPECTED'"
            exit 1
          fi

          # The image must ship the Studio, not only the API: `/setup` is the
          # first page a new operator opens.
          if ! curl --max-time 5 -fsS http://localhost:1989/setup | grep -q '<title>LumiBase Studio</title>'; then
            echo "::error::/setup did not serve the Studio shell"
            exit 1
          fi
          echo "Image reports $ACTUAL and serves the Studio."

          # Hardening invariants: a non-root user, and Docker's own HEALTHCHECK
          # (the Node probe, since the image has no shell or curl) reporting
          # healthy rather than merely "running".
          USER_ID="$(docker inspect --format '{{.Config.User}}' "$IMAGE")"
          case "$USER_ID" in
            ""|0|0:*|root|root:*) echo "::error::image runs as root (User='$USER_ID')"; exit 1 ;;
          esac
          for _ in $(seq 1 12); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' lumibase-release-smoke)"
            [ "$STATUS" = healthy ] && break
            sleep 5
          done
          if [ "$STATUS" != healthy ]; then
            echo "::error::container HEALTHCHECK reports '$STATUS'"
            exit 1
          fi
          echo "Runs as $USER_ID with a read-only root filesystem; HEALTHCHECK healthy."

  publish-npm-packages:
    name: Publish npm packages
    runs-on: ubuntu-latest
    needs: github-release
    if: ${{ vars.PUBLISH_NPM_PACKAGES == 'true' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check npm token
        id: check_token
        shell: bash
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping npm package publishing because NPM_TOKEN is not configured."
          fi

      - name: Build packages
        if: steps.check_token.outputs.has_token == 'true'
        run: pnpm --filter "./packages/**" build

      - name: Publish public packages
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const packages = fs.readdirSync('packages', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => ({ dir: `packages/${entry.name}`, path: `packages/${entry.name}/package.json` }))
            .filter(({ path }) => fs.existsSync(path))
            .map(({ dir, path }) => ({ dir, manifest: JSON.parse(fs.readFileSync(path, 'utf8')) }))
            .filter(({ manifest }) => manifest.private !== true);

          if (packages.length === 0) {
            console.log('No public packages to publish.');
            process.exit(0);
          }

          const failures = [];
          for (const { dir, manifest } of packages) {
            const id = `${manifest.name}@${manifest.version}`;
            const distTag = manifest.version.includes('-') ? 'next' : 'latest';
            console.log(`Publishing ${id} from ${dir} with dist-tag ${distTag}...`);
            // Run from the package dir: `pnpm --dir <path> publish` is broken on pnpm 9.x.
            // --provenance emits a signed attestation (the job has id-token: write).
            // Capture output so one package's failure does not abort the rest.
            const result = cp.spawnSync('pnpm', ['publish', '--access', 'public', '--tag', distTag, '--no-git-checks', '--provenance'], {
              cwd: dir,
              encoding: 'utf8',
              env: process.env,
            });
            process.stdout.write(result.stdout || '');
            process.stderr.write(result.stderr || '');

            if (result.status === 0) {
              console.log(`✓ Published ${id}`);
              continue;
            }

            // Idempotent re-run: the version is already on the registry.
            const output = `${result.stdout || ''}${result.stderr || ''}`;
            if (/cannot publish over|previously published version|EPUBLISHCONFLICT/i.test(output)) {
              console.log(`• Skipping ${id} (already published).`);
              continue;
            }

            console.error(`✗ Failed to publish ${id}`);
            failures.push(manifest.name);
          }

          if (failures.length > 0) {
            console.error(`npm publish failed for: ${failures.join(', ')}`);
            process.exit(1);
          }
          NODE
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The step above picks `--tag next` for a prerelease, and that is still
      # not enough: npm assigns `latest` on a package's **first** publish
      # regardless of `--tag`. `lumibase` and `@lumibase/contracts` were both
      # born at `1.0.0-rc.1` and ended up with `latest` on the RC, so
      # `npm i lumibase` and `npm i @lumibase/sdk` resolve to two different
      # generations of the same product.
      #
      # Report only — this step never mutates the registry. Epic #331 states
      # "không tự đổi dist-tag", and #448 records that the owner deliberately
      # chose to keep `latest = 1.0.0-rc.1` for `lumibase`. Moving a dist-tag is
      # therefore a human decision: run `pnpm dist-tags:fix` when that decision
      # has been made.
      - name: Verify npm dist-tags
        if: steps.check_token.outputs.has_token == 'true'
        run: node scripts/check-npm-dist-tags.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
