name = "lumibase-cms"
main = "src/cloudflare.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive binding pools PostgreSQL connections at the edge.
# Run `wrangler hyperdrive create lumibase-hyperdrive --connection-string=...`
# and paste the resulting id below.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_HYPERDRIVE_ID"

# Cloudflare KV for caching configurations and permissions (Strict Rule #4).
# [[kv_namespaces]]
# binding = "CONFIG_CACHE"
# id = "REPLACE_WITH_KV_ID"

# Cloudflare R2 bucket for media (Strict Rule: storage).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "lumibase-media"

[vars]
LUMIBASE_ENV = "development"
# Set to "true" only in local dev. Accepts `Bearer dev:<email>` tokens
# and `?site=<id>` query for tenant resolution.
LUMIBASE_DEV_AUTH = "true"
# Cloudflare Access & Custom JWT bindings. Override per environment.
CF_ACCESS_CERTS_URL = ""
CF_ACCESS_AUDIENCE = ""
JWT_SECRET = "dev_secret_key"

# ─── Durable Objects ──────────────────────────────────────────────────────────
# One SiteRoom DO instance per siteId handles all WebSocket connections for
# that site (presence, subscriptions, realtime event fan-out).
[[durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[durable_objects.migrations]
tag = "v1"
new_classes = ["SiteRoom"]

# ─── Queues ───────────────────────────────────────────────────────────────────
# Used by ItemService to publish mutation events to SiteRoom without blocking.
# [[queues.producers]]
# binding = "REALTIME_QUEUE"
# queue = "lumibase-realtime"
