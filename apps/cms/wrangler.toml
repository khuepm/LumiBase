name = "lumibase-cms"
main = "src/cloudflare.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive binding pools PostgreSQL connections at the edge.
# Run `wrangler hyperdrive create lumibase-hyperdrive --connection-string=...`
# and paste the resulting id below.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_HYPERDRIVE_ID"

# Cloudflare KV for caching configurations and permissions (Strict Rule #4).
# [[kv_namespaces]]
# binding = "CONFIG_CACHE"
# id = "REPLACE_WITH_KV_ID"

# Cloudflare R2 bucket for media (Strict Rule: storage).
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "lumibase-media"

[vars]
LUMIBASE_ENV = "development"
LUMIBASE_VERSION = "unknown"
LUMIBASE_GIT_SHA = "unknown"
LUMIBASE_BUILD_TIME = "unknown"
LUMIBASE_RELEASE_CHANNEL = "development"
# Set to "true" only in local dev. Accepts `Bearer dev:<email>` tokens
# and `?site=<id>` query for tenant resolution.
LUMIBASE_DEV_AUTH = "true"
# Local-only auth secrets belong in `apps/cms/.dev.vars`, for example:
# JWT_SECRET=dev_secret_key
# CF_ACCESS_CERTS_URL=
# CF_ACCESS_AUDIENCE=

# ─── Durable Objects ──────────────────────────────────────────────────────────
# One SiteRoom DO instance per siteId handles all WebSocket connections for
# that site (presence, subscriptions, realtime event fan-out).
[[durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRoom"]

# ─── Cron Triggers ────────────────────────────────────────────────────────────
# Audit-log retention rotation (admin-setup-wizard task 11.4; Req 15.5;
# design §10.2). Fires the Worker's `scheduled()` handler (see src/cloudflare.ts)
# every hour to prune `audit_log` / `login_attempts` rows past
# LUMIBASE_AUDIT_RETENTION_DAYS. Self-hosted Node drives the same rotation with
# node-cron in src/serve.ts instead.
[triggers]
crons = ["0 * * * *"]

# ─── Queues ───────────────────────────────────────────────────────────────────
# Used by ItemService to publish mutation events to SiteRoom without blocking.
# [[queues.producers]]
# binding = "REALTIME_QUEUE"
# queue = "lumibase-realtime"

# ─── Environment Profiles ────────────────────────────────────────────────────
# Top-level [vars] is intentionally local/development only. Named environments
# below repeat their non-sensitive vars and bindings because Wrangler treats
# environment-scoped values and bindings as independent deployment profiles.
# Secrets such as JWT_SECRET, ENCRYPTION_KEY, CF_ACCESS_CERTS_URL,
# CF_ACCESS_AUDIENCE, and optional METRICS_TOKEN must be set with
# `wrangler secret put --env <environment>`, not hardcoded here.
#
# Sentry error monitoring (src/cloudflare.ts wraps the handler with
# @sentry/cloudflare's withSentry). The DSN is read from env per-request and is
# a no-op when unset, so it can stay out of local/dev. Set per environment:
#   wrangler secret put SENTRY_DSN --env <environment>
# Optionally tune SENTRY_TRACES_SAMPLE_RATE (0–1, default 1.0) as a [vars] entry.
#
# ─── Shared-domain routing (dev / staging / demo) ─────────────────────────────
# These non-production environments serve Studio (Cloudflare Pages) and the CMS
# (this Worker) from ONE hostname. The Studio Pages custom domain owns the
# hostname for static/SPA paths; the Worker `routes` below claim the API surface
# on the same hostname. Cloudflare gives a Worker route priority over a Pages
# custom domain for the paths it matches, so `/api/*`, `/health`, `/metrics`,
# and `/scim/*` reach the Worker while every other path (the SPA) is served by
# Pages. `/test-auth` is intentionally NOT routed — it is a local-dev helper.
#
# Because Studio and CMS share an origin here, the SPA calls `/api/...`
# same-origin and CORS is unnecessary, so CORS_ALLOWED_ORIGINS is empty.
# (Production still uses split origins studio.lumibase.dev + api.lumibase.dev
# and keeps its cross-origin CORS allow-list below.)
#
# NOTE: `zone_name` must match the registrable zone in this Cloudflare account.
# The Worker, the Studio Pages custom domain, and the DNS record for each
# hostname must all exist before these routes resolve — see the deploy docs.

[env.staging]
name = "lumibase-cms-staging"

[env.staging.vars]
LUMIBASE_ENV = "staging"
LUMIBASE_VERSION = "unknown"
LUMIBASE_GIT_SHA = "unknown"
LUMIBASE_BUILD_TIME = "unknown"
LUMIBASE_RELEASE_CHANNEL = "staging"
LUMIBASE_DEV_AUTH = "false"
# Studio shares the staging hostname (staging.lumibase.dev), so the SPA reaches
# the API same-origin and no CORS allow-list is needed. Add external consumer
# origins here if any need cross-origin API access.
CORS_ALLOWED_ORIGINS = ""

[[env.staging.routes]]
pattern = "staging.lumibase.dev/api/*"
zone_name = "lumibase.dev"

[[env.staging.routes]]
pattern = "staging.lumibase.dev/health"
zone_name = "lumibase.dev"

[[env.staging.routes]]
pattern = "staging.lumibase.dev/metrics"
zone_name = "lumibase.dev"

[[env.staging.routes]]
pattern = "staging.lumibase.dev/scim/*"
zone_name = "lumibase.dev"

[[env.staging.durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRoom"]

# [[env.staging.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_STAGING_HYPERDRIVE_ID"

# [[env.staging.kv_namespaces]]
# binding = "CONFIG_CACHE"
# id = "REPLACE_WITH_STAGING_KV_ID"

# [[env.staging.r2_buckets]]
# binding = "MEDIA"
# bucket_name = "lumibase-media-staging"

[env.staging.triggers]
crons = ["0 * * * *"]

[env.production]
name = "lumibase-cms-production"

[env.production.vars]
LUMIBASE_ENV = "production"
LUMIBASE_VERSION = "unknown"
LUMIBASE_GIT_SHA = "unknown"
LUMIBASE_BUILD_TIME = "unknown"
LUMIBASE_RELEASE_CHANNEL = "production"
LUMIBASE_DEV_AUTH = "false"
# Origins allowed to call the API cross-origin (comma-separated). The Studio
# SPA (studio.lumibase.dev) is served from a different origin than the CMS
# Worker, so it must be listed here or browser requests are blocked.
# Production rejects "*"; adjust to your real Studio/consumer domains.
CORS_ALLOWED_ORIGINS = "https://studio.lumibase.dev"

# ─── Production routing (split origins) ──────────────────────────────────────
# Production keeps the API and the Studio SPA on SEPARATE origins:
#   api.lumibase.dev    → this Worker (every path)
#   studio.lumibase.dev → Studio Pages project (cross-origin, see CORS above)
# `custom_domain = true` makes Wrangler create + manage the api.lumibase.dev
# DNS record (proxied) automatically on `wrangler deploy --env production`, so
# no manual DNS entry is required. Because api.lumibase.dev is owned solely by
# this Worker (not shared with Pages), the Worker receives every path on it.
[[env.production.routes]]
pattern = "api.lumibase.dev"
custom_domain = true

[[env.production.durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRoom"]

# [[env.production.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID"

# [[env.production.kv_namespaces]]
# binding = "CONFIG_CACHE"
# id = "REPLACE_WITH_PRODUCTION_KV_ID"

# [[env.production.r2_buckets]]
# binding = "MEDIA"
# bucket_name = "lumibase-media"

[env.production.triggers]
crons = ["0 * * * *"]

# ─── Dev environment (dev.lumibase.dev, shared domain) ───────────────────────
# Continuous-integration environment, auto-deployed from the `dev` branch.
[env.dev]
name = "lumibase-cms-dev"

[env.dev.vars]
LUMIBASE_ENV = "staging"
LUMIBASE_VERSION = "unknown"
LUMIBASE_GIT_SHA = "unknown"
LUMIBASE_BUILD_TIME = "unknown"
LUMIBASE_RELEASE_CHANNEL = "dev"
LUMIBASE_DEV_AUTH = "false"
# Studio shares dev.lumibase.dev → same-origin API calls, no CORS needed.
CORS_ALLOWED_ORIGINS = ""

[[env.dev.routes]]
pattern = "dev.lumibase.dev/api/*"
zone_name = "lumibase.dev"

[[env.dev.routes]]
pattern = "dev.lumibase.dev/health"
zone_name = "lumibase.dev"

[[env.dev.routes]]
pattern = "dev.lumibase.dev/metrics"
zone_name = "lumibase.dev"

[[env.dev.routes]]
pattern = "dev.lumibase.dev/scim/*"
zone_name = "lumibase.dev"

[[env.dev.durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRoom"]

[env.dev.triggers]
crons = ["0 * * * *"]

# ─── Demo environment (demo.lumibase.dev, shared domain) ─────────────────────
# Public demo / showcase. Deployed manually via workflow_dispatch. May be
# seeded with sample data out of band.
[env.demo]
name = "lumibase-cms-demo"

[env.demo.vars]
LUMIBASE_ENV = "staging"
LUMIBASE_VERSION = "unknown"
LUMIBASE_GIT_SHA = "unknown"
LUMIBASE_BUILD_TIME = "unknown"
LUMIBASE_RELEASE_CHANNEL = "demo"
LUMIBASE_DEV_AUTH = "false"
# Studio shares demo.lumibase.dev → same-origin API calls, no CORS needed.
CORS_ALLOWED_ORIGINS = ""

[[env.demo.routes]]
pattern = "demo.lumibase.dev/api/*"
zone_name = "lumibase.dev"

[[env.demo.routes]]
pattern = "demo.lumibase.dev/health"
zone_name = "lumibase.dev"

[[env.demo.routes]]
pattern = "demo.lumibase.dev/metrics"
zone_name = "lumibase.dev"

[[env.demo.routes]]
pattern = "demo.lumibase.dev/scim/*"
zone_name = "lumibase.dev"

[[env.demo.durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

[[env.demo.migrations]]
tag = "v1"
new_sqlite_classes = ["SiteRoom"]

[env.demo.triggers]
crons = ["0 * * * *"]
