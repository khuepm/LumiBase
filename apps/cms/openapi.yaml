            schema: { $ref: '#/components/schemas/ApiKeyAttachPolicyRequest' }
      responses:
        '201':
          description: Attached
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ApiKeyPolicyAttachment' }
        '409':
          description: Access policy conflict or warning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api-keys/{id}/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: policyId, in: path, required: true, schema: { type: string } }
    delete:
      summary: Detach a policy from an API key
      responses: { '204': { description: Detached } }
  /shares:
    parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
    post:
      summary: Create a public share link for an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShareSecretResult' }
  /shares/{token}:
    get:
      summary: Read a shared item through the share role permission
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: X-Lumi-Share-Password
          in: header
          required: false
          schema: { type: string }
        - name: password
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Shared item payload, field-masked by the share role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401':
          description: Password required or share expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Share revoked, not yet valid, max uses reached, or role denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /shares/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Revoke a share link
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShareResource' }
  /permissions/me:
    parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
    get:
      summary: Compiled permission bundle for the active principal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PermissionBundle' }
  /permissions/check:
    parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
    post:
      summary: Evaluate (collection, action, item) and return the verdict + trace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, action]
              properties:
                collection: { type: string }
                action: { type: string, enum: [create, read, update, delete, share] }
                item: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PermissionCheckResult' }

  # ---------------------------------------------------------------------------
