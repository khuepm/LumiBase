    post:
      summary: Trigger a manual flow run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional input data passed to the flow entry node
              additionalProperties: true
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FlowRunResult' }

  /flows/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: List runs for a flow (latest 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FlowRun' }

  # ---------------------------------------------------------------------------
  # Marketplace (POST-GA3)
  # ---------------------------------------------------------------------------
  /marketplace/extensions:
    get:
      summary: List published extensions in the marketplace
      security: []
      parameters:
        - { name: type, in: query, schema: { type: string }, description: 'Filter by extension type' }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MarketplaceExtension' }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /marketplace/extensions/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      summary: Get marketplace extension detail (incl. signature)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MarketplaceExtension' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /marketplace/extensions/{slug}/install:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      summary: Install a marketplace extension into the active site
      responses:
        '201':
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExtensionResource' }
        '409':
          description: Already installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /marketplace/publish:
    post:
      summary: Publish an extension to the marketplace
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, version, type, bundleUrl, signature, keyId]
              properties:
                name: { type: string }
                version: { type: string }
                type: { type: string }
                bundleUrl: { type: string, format: uri }
                signature: { type: string, description: 'Base64-encoded Ed25519 signature of SHA-256(bundle)' }
                keyId: { type: string }
                manifest: { type: object, additionalProperties: true }
                capabilities: { type: array, items: { type: string } }
      responses:
        '201':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MarketplaceExtension' }

  # ---------------------------------------------------------------------------
  # Materialized Collections (POST-GA4)
  # ---------------------------------------------------------------------------
  /materialize:
    get:
      summary: List materialized collections for the active site
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaterializedCollection' }
    post:
      summary: Register a new materialized collection and create its physical table
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, target]
              properties:
                collection: { type: string }
                target: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                refreshStrategy: { type: string, enum: [auto, cron, manual], default: manual }
                refreshCron: { type: string, nullable: true }
                projection:
                  type: object
                  properties:
                    fields: { type: array, items: { type: string }, default: ['*'] }
                    orderBy: { type: string, nullable: true }
                filter: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MaterializedCollection' }
        '404':
          description: Source collection not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /materialize/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Trigger a physical table refresh (TRUNCATE + re-INSERT)
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rowsInserted: { type: integer }
                      refreshedAt: { type: string, format: date-time }

  /materialize/{id}/data:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Query the physical materialized table directly
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /materialize/{id}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Drop the physical table and remove the materialized collection record
      responses:
        '204': { description: Dropped }

  # ---------------------------------------------------------------------------
  # SCIM Token Management (POST-GA5)
  # ---------------------------------------------------------------------------
  /scim/tokens:
    get:
      summary: List active SCIM tokens for the site (masked — no raw token returned)
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SCIMTokenMeta' }
    post:
      summary: Create a new SCIM token
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1 }
                lifespanDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: Token created — raw token returned once only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SCIMTokenCreated' }

  /scim/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke a SCIM token immediately
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
        '404':
          description: Token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scim/tokens/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Rotate a SCIM token (creates new token, old expires after 24h grace period)
      responses:
        '200':
          description: New token created — raw token returned once only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SCIMTokenRotated' }
        '404':
          description: Active token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
