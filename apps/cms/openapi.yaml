      summary: Atomically update collection and its fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                $ref: '#/components/schemas/Collection'
                fields:
                  type: array
                  items: { $ref: '#/components/schemas/Field' }
