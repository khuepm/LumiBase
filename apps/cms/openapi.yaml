      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
                conversationId: { type: string, nullable: true }
      responses:
        '200':
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AIChatResponse' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ai/conversations:
    get:
      summary: List AI conversations for the active site
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AIConversation' }

  /ai/conversations/{conversationId}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: conversationId, in: path, required: true, schema: { type: string } }
    get:
      summary: Get conversation history (messages)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AIMessage' }
    delete:
      summary: Delete a conversation and all messages
      responses:
        '204': { description: Deleted }

  /ai/approvals:
    get:
      summary: List pending AI action approvals for the site
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AIApproval' }

  /ai/approvals/{id}/decide:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Approve or reject a pending AI action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AIApproval' }

  /ai/suggest-field:
    post:
      summary: Suggest field type and interface for a given field name + context
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fieldName]
              properties:
                fieldName: { type: string }
                collectionName: { type: string }
                existingFields: { type: array, items: { type: string } }
      responses:
        '200':
          description: Suggestion
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      type: { type: string }
                      interface: { type: string }
                      confidence: { type: number, format: float }

  /ai/content-assist:
    post:
      summary: Generate or rewrite content for a field value using RAG context
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, collection, field]
              properties:
                prompt: { type: string, maxLength: 1000 }
                collection: { type: string }
                field: { type: string }
                itemId: { type: string, nullable: true }
                existingValue: { type: string, nullable: true }
      responses:
        '200':
          description: AI-generated content
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      content: { type: string }
                      tokensUsed: { type: integer }

  # ---------------------------------------------------------------------------
