  # ---------------------------------------------------------------------------
  # Materialized Collections (POST-GA4)
  # ---------------------------------------------------------------------------
  /materialize:
    get:
      summary: List materialized collections for the active site
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaterializedCollection' }
    post:
      summary: Register a new materialized collection and create its physical table
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, target]
              properties:
                collection: { type: string }
                target: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
                refreshStrategy: { type: string, enum: [auto, cron, manual], default: manual }
                refreshCron: { type: string, nullable: true }
                projection:
                  type: object
                  properties:
                    fields: { type: array, items: { type: string }, default: ['*'] }
                    orderBy: { type: string, nullable: true }
                filter: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MaterializedCollection' }
        '404':
          description: Source collection not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /materialize/{id}/refresh:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Trigger a physical table refresh (TRUNCATE + re-INSERT)
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rowsInserted: { type: integer }
                      refreshedAt: { type: string, format: date-time }

  /materialize/{id}/data:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Query the physical materialized table directly
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      limit: { type: integer }
                      offset: { type: integer }

  /materialize/{id}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Drop the physical table and remove the materialized collection record
      responses:
        '204': { description: Dropped }

  # ---------------------------------------------------------------------------
  # SCIM Token Management (POST-GA5)
  # ---------------------------------------------------------------------------
  /scim/tokens:
    get:
      summary: List active SCIM tokens for the site (masked — no raw token returned)
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SCIMTokenMeta' }
    post:
      summary: Create a new SCIM token
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, minLength: 1 }
                lifespanDays: { type: integer, minimum: 1, maximum: 365, default: 90 }
      responses:
        '201':
          description: Token created — raw token returned once only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SCIMTokenCreated' }

  /scim/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      summary: Revoke a SCIM token immediately
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success: { type: boolean }
        '404':
          description: Token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /scim/tokens/{id}/rotate:
    parameters:
      - $ref: '#/components/parameters/SiteHeader'
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Rotate a SCIM token (creates new token, old expires after 24h grace period)
      responses:
        '200':
          description: New token created — raw token returned once only
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SCIMTokenRotated' }
        '404':
          description: Active token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /deployments/targets:
    get:
      summary: List deployment targets (provider token omitted)
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DeploymentTarget' }
    post:
      summary: Create a deployment target (token encrypted on write)
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
  /deployments/targets/{id}:
    parameters:
      - { $ref: '#/components/parameters/SiteHeader' }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Update a deployment target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeploymentTargetCreate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeploymentTarget' }
    delete:
      summary: Delete a deployment target
      responses:
        '200':
          description: Deleted
  /deployments/targets/{id}/deploy:
    post:
      summary: Trigger a build/deploy on a target
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: Deployment triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
        '502':
          description: Provider rejected the trigger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /deployments:
    get:
      summary: List deployments (filterable)
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: targetId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, building, ready, error, canceled] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Deployment' }
  /deployments/{id}:
    get:
      summary: Get a single deployment
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
        '404':
          description: Deployment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /deployments/{id}/logs:
    get:
      summary: Fetch build logs for a deployment
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      log: { type: string }
  /deployments/{id}/refresh:
    post:
      summary: Force a status sync from the provider
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Deployment' }
  /deployments/webhook/{provider}:
    post:
      summary: Inbound provider status webhook (public, signature-verified)
      description: |
        Public, pre-auth endpoint. Authenticated by the provider's request
        signature over the raw body (Vercel HMAC-SHA1, Netlify JWS/HS256), not a
        bearer token. The shared secret is the per-site setting
        `deployment.webhook.<provider>`. Requires the `X-Lumi-Site` header.
      security: []
      parameters:
        - { $ref: '#/components/parameters/SiteHeader' }
        - { name: provider, in: path, required: true, schema: { type: string, enum: [vercel, netlify] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Accepted (ref applied or ignored)
        '401':
          description: Invalid or missing signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
