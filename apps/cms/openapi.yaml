            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      summary: Update flow (graph, status, metadata)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlowResource' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FlowResource' }
