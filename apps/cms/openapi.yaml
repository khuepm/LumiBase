  /shares:
    parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
    post:
      summary: Create a public share link for an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ShareSecretResult' }
  /shares/{token}:
    get:
      summary: Read a shared item through the share role permission
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: X-Lumi-Share-Password
          in: header
          required: false
          schema: { type: string }
        - name: password
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Shared item payload, field-masked by the share role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, additionalProperties: true }
        '401':
          description: Password required or share expired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Share revoked, not yet valid, max uses reached, or role denied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
