openapi: 3.1.0
info:
  title: LumiBase CMS API
  version: 0.1.0
  description: |
    Edge-native Headless CMS API. See `docs/api/hono-api-spec.md` for the full
    surface; this file is the machine-readable contract that ships with the
    repo. Endpoints land incrementally — Phase 0 covers auth/health only.

servers:
  - url: https://api.lumibase.dev/api/v1
    description: Production
  - url: http://127.0.0.1:1989/api/v1
    description: Local wrangler dev

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SiteHeader:
      name: X-Lumi-Site
      in: header
      required: true
      schema: { type: string }
      description: Active tenant id. Required for every authenticated endpoint.
  schemas:
    Error:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              path:
                type: array
                items: { type: string }
              trace: { type: object, additionalProperties: true }
    AuthMe:
      type: object
      properties:
        data:
          type: object
          required: [logtoId, siteId, roles]
          properties:
            logtoId: { type: string }
            email: { type: string, format: email, nullable: true }
            roles:
              type: array
              items: { type: string }
            siteId: { type: string }
            permissions:
              nullable: true
              description: Computed permission matrix. Populated in Phase C.
              type: object
              additionalProperties: true
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok] }
        env: { type: string }
        ts: { type: string, format: date-time }
    Version:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        apiVersion: { type: integer }
        env: { type: string }
    Collection:
      type: object
      required: [id, siteId, name]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
        label: { type: string, nullable: true }
        pluralLabel: { type: string, nullable: true }
        hidden: { type: boolean }
        system: { type: boolean }
        singleton: { type: boolean }
        icon: { type: string, nullable: true }
        color: { type: string, nullable: true }
        note: { type: string, nullable: true }
        primaryKeyField: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
        primaryKeyType: { type: string, enum: [nanoid, uuid, integer, bigInteger, string] }
        storageMode: { type: string, enum: [jsonb, materialized, physical, external] }
        displayTemplate: { type: string, nullable: true }
        sortField: { type: string, nullable: true }
        archiveField: { type: string, nullable: true }
        archiveValue: { type: string, nullable: true }
        unarchiveValue: { type: string, nullable: true }
        itemDuplicationFields:
          type: array
          items: { type: string }
        translations: { type: object, additionalProperties: true }
        accountability: { type: string, enum: [all, activity, none] }
        versioning: { type: boolean }
        meta: { type: object, additionalProperties: true }
        systemFields:
          type: array
          items: { $ref: '#/components/schemas/Field' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Field:
      type: object
      required: [id, name, type, interface]
      properties:
        id: { type: string }
        collectionId: { type: string }
        name: { type: string, pattern: '^[a-z][a-z0-9_]{0,62}$' }
        type: { type: string }
        interface: { type: string }
        display: { type: string, nullable: true }
        label: { type: string, nullable: true }
        note: { type: string, nullable: true }
        defaultValue: {}
        nullable: { type: boolean }
        unique: { type: boolean }
        indexed: { type: boolean }
        searchable: { type: boolean }
        length: { type: integer, nullable: true }
        precision: { type: integer, nullable: true }
        scale: { type: integer, nullable: true }
        special:
          type: array
          items: { type: string }
        options: { type: object, additionalProperties: true }
        displayOptions: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        conditions:
          type: array
          items: { type: object, additionalProperties: true }
        required: { type: boolean }
        readonly: { type: boolean }
        hidden: { type: boolean }
        encrypted: { type: boolean }
        versioned: { type: boolean }
        rawEnabled: { type: boolean }
        width: { type: string, enum: [half, full, fill] }
        group: { type: string, nullable: true }
        sortOrder: { type: integer }
        system: { type: boolean }
        locked: { type: boolean }
        generated: { type: boolean }
        column: { type: string }
    Role:
      type: object
      required: [id, siteId, name]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        adminAccess: { type: boolean }
        appAccess: { type: boolean }
        createdAt: { type: string, format: date-time }
    Policy:
      type: object
      required: [id, siteId, name]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        rules: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    PermissionRow:
      type: object
      required: [id, policyId, collection, action]
      properties:
        id: { type: string }
        siteId: { type: string }
        policyId: { type: string }
        collection: { type: string }
        action: { type: string, enum: [create, read, update, delete, share] }
        permissions: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
        presets: { type: object, additionalProperties: true }
        fields:
          type: array
          items: { type: string }
    PermissionBundle:
      type: object
      required: [admin, byKey, roles]
      properties:
        admin: { type: boolean }
        byKey:
          type: object
          additionalProperties: { type: object, additionalProperties: true }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              adminAccess: { type: boolean }
              appAccess: { type: boolean }
    PermissionCheckResult:
      type: object
      required: [allowed, fields]
      properties:
        allowed: { type: boolean }
        reason: { type: string, nullable: true }
        fields:
          type: array
          items: { type: string }
        rule: { type: object, nullable: true, additionalProperties: true }
        presets: { type: object, additionalProperties: true }
    # --- Access Conflict Check ---
    AccessConflictCheckRequest:
      type: object
      required: [target]
      properties:
        target:
          type: object
          required: [type, id]
          properties:
            type: { type: string, enum: [role, user, api_key] }
            id: { type: string, minLength: 1 }
        addPolicies:
          type: array
          items: { type: string }
          default: []
        removePolicies:
          type: array
          items: { type: string }
          default: []
    AccessConflict:
      type: object
      required: [severity, collection, action, existingPolicy, incomingPolicy, reason]
      properties:
        severity: { type: string, enum: [warning, blocking] }
        collection: { type: string }
        action: { type: string }
        existingPolicy: { type: string }
        incomingPolicy: { type: string }
        reason: { type: string }
    AccessConflictReport:
      type: object
      required: [ok, conflicts, warnings]
      properties:
        ok: { type: boolean }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/AccessConflict' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AccessConflict' }
    AccessExportManifest:
      type: object
      required: [schema, exportedAt, roles, policies, bindings, apiKeys]
      properties:
        schema: { type: string, const: lumibase.access@v1 }
        exportedAt: { type: string, format: date-time }
        roles:
          type: array
          items: { type: object, additionalProperties: true }
        policies:
          type: array
          items: { type: object, additionalProperties: true }
        bindings:
          type: object
          additionalProperties: true
        apiKeys:
          type: array
          items: { type: object, additionalProperties: true }
    AccessImportResult:
      type: object
      required: [dryRun, valid, errors, diff, conflicts]
      properties:
        dryRun: { type: boolean }
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
              path: { type: string, nullable: true }
        diff: { type: object, additionalProperties: true }
        conflicts: { $ref: '#/components/schemas/AccessConflictReport' }
        mode: { type: string, enum: [merge, replace-managed, replace-all], nullable: true }
        applied: { type: boolean, nullable: true }
        audit:
          type: object
          nullable: true
          additionalProperties: true
    ApiKeyResource:
      type: object
      required: [id, siteId, name, prefix, revokedAt, roles, policies]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        prefix: { type: string }
        createdBy: { type: string, nullable: true }
        rotatedAt: { type: string, format: date-time, nullable: true }
        rotatedBy: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        lastUsedIp: { type: string, nullable: true }
        lastUsedUserAgent: { type: string, nullable: true }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        roles:
          type: array
          items: { $ref: '#/components/schemas/ApiKeyRoleAttachment' }
        policies:
          type: array
          items: { $ref: '#/components/schemas/ApiKeyPolicyAttachment' }
    ApiKeySecretResult:
      allOf:
        - $ref: '#/components/schemas/ApiKeyResource'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Plaintext token returned only on create/rotate.
    ApiKeyCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 96 }
        description: { type: string, maxLength: 512 }
        expiresAt: { type: string, format: date-time, nullable: true }
        metadata: { type: object, additionalProperties: true }
    ApiKeyRotateRequest:
      type: object
      properties:
        expiresAt: { type: string, format: date-time, nullable: true }
    ApiKeyRoleAttachment:
      type: object
      required: [apiKeyId, siteId, roleId, priority]
      properties:
        apiKeyId: { type: string }
        siteId: { type: string }
        roleId: { type: string }
        priority: { type: integer }
        createdAt: { type: string, format: date-time }
    ApiKeyPolicyAttachment:
      type: object
      required: [apiKeyId, siteId, policyId, priority]
      properties:
        apiKeyId: { type: string }
        siteId: { type: string }
        policyId: { type: string }
        priority: { type: integer }
        createdAt: { type: string, format: date-time }
    ApiKeyAttachRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId: { type: string, minLength: 1 }
        priority: { type: integer }
        overrideWarnings: { type: boolean }
    ApiKeyAttachPolicyRequest:
      type: object
      required: [policyId]
      properties:
        policyId: { type: string, minLength: 1 }
        priority: { type: integer }
        overrideWarnings: { type: boolean }
    ShareResource:
      type: object
      required: [id, siteId, collection, itemId, roleId, usedCount]
      properties:
        id: { type: string }
        siteId: { type: string }
        collection: { type: string }
        itemId: { type: string }
        roleId: { type: string }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        maxUses: { type: integer, nullable: true }
        usedCount: { type: integer }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: string, nullable: true }
        createdBy: { type: string, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    ShareSecretResult:
      allOf:
        - $ref: '#/components/schemas/ShareResource'
        - type: object
          required: [token, url]
          properties:
            token:
              type: string
              description: Plaintext share token returned only on create.
            url: { type: string }
    ShareCreateRequest:
      type: object
      required: [collection, itemId, roleId]
      properties:
        collection: { type: string, minLength: 1 }
        itemId: { type: string, minLength: 1 }
        roleId: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        validFrom: { type: string, format: date-time, nullable: true }
        validUntil: { type: string, format: date-time, nullable: true }
        maxUses: { type: integer, minimum: 1, nullable: true }
    # --- AI (POST-GA1) ---
    AIChatResponse:
      type: object
      properties:
        status: { type: string, enum: [executed, pending_approval, denied] }
        message: { type: string }
        conversationId: { type: string }
        pendingId: { type: string, nullable: true }
        result: { type: object, additionalProperties: true, nullable: true }
    AIConversation:
      type: object
      properties:
        id: { type: string }
        siteId: { type: string }
        userId: { type: string, nullable: true }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AIMessage:
      type: object
      properties:
        id: { type: string }
        conversationId: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        toolCalls:
          type: array
          nullable: true
          items: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true, nullable: true }
        createdAt: { type: string, format: date-time }
    AIApproval:
      type: object
      properties:
        id: { type: string }
        siteId: { type: string }
        userId: { type: string, nullable: true }
        conversationId: { type: string, nullable: true }
        toolName: { type: string }
        toolArgs: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, approved, rejected] }
        decidedBy: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    # --- Flows (POST-GA2) ---
    FlowGraph:
      type: object
      properties:
        entry: { type: string, nullable: true }
        nodes:
          type: array
          items:
            type: object
            required: [id, key]
            properties:
              id: { type: string }
              key: { type: string }
              options: { type: object, additionalProperties: true }
              next: { type: string, nullable: true }
              onError: { type: string, nullable: true }
    FlowResource:
      type: object
      required: [name, triggerType]
      properties:
        id: { type: string }
        siteId: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive, draft], default: draft }
        triggerType: { type: string, enum: [webhook, event, schedule, manual] }
        triggerOptions: { type: object, additionalProperties: true }
        graph: { $ref: '#/components/schemas/FlowGraph' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlowRun:
      type: object
      properties:
        id: { type: string }
        flowId: { type: string }
        siteId: { type: string }
        status: { type: string, enum: [running, success, error] }
        input: { type: object, additionalProperties: true }
        steps:
          type: array
          items: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    FlowRunResult:
      type: object
      properties:
        runId: { type: string }
        status: { type: string, enum: [success, error] }
        steps:
          type: array
          items: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
    # --- Marketplace (POST-GA3) ---
    MarketplaceExtension:
      type: object
      required: [id, name, version, type, bundleUrl]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        version: { type: string }
        type: { type: string }
        bundleUrl: { type: string, format: uri }
        signature: { type: string, description: 'Base64-encoded Ed25519 detached signature' }
        keyId: { type: string }
        manifest: { type: object, additionalProperties: true }
        capabilities:
          type: array
          items: { type: string }
        publishedAt: { type: string, format: date-time }
        verified: { type: boolean }
    # --- Materialized Collections (POST-GA4) ---
    MaterializedCollection:
      type: object
      required: [id, siteId, collection, target]
      properties:
        id: { type: string }
        siteId: { type: string }
        collection: { type: string }
        target: { type: string }
        refreshStrategy: { type: string, enum: [auto, cron, manual] }
        refreshCron: { type: string, nullable: true }
        projection:
          type: object
          properties:
            fields: { type: array, items: { type: string } }
            orderBy: { type: string, nullable: true }
        filter: { type: object, additionalProperties: true }
        lastRefreshedAt: { type: string, format: date-time, nullable: true }
        rowCount: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    # --- SCIM Tokens (POST-GA5) ---
    SCIMTokenMeta:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    SCIMTokenCreated:
      allOf:
        - $ref: '#/components/schemas/SCIMTokenMeta'
        - type: object
          properties:
            token:
              type: string
              description: Raw SCIM token — shown exactly once, not stored in plaintext
    SCIMTokenRotated:
      allOf:
        - $ref: '#/components/schemas/SCIMTokenCreated'
        - type: object
          properties:
            oldTokenGraceExpiresAt:
              type: string
              format: date-time
              description: Old token remains valid until this time (24h grace period)
    # --- CDC (ClickHouse CDC) ---
    CdcConnectorType:
      type: string
      enum: [debezium_kafka, materialized_engine, airbyte]
    CdcDeploymentTarget:
      type: string
      enum: [docker_compose, cloudflare_workers]
    CdcPipeline:
      type: object
      required: [id, siteId, pipelineName, connectorType, status, replicationTables, config, createdAt, updatedAt]
      properties:
        id: { type: string }
        siteId: { type: string }
        pipelineName: { type: string }
        connectorType: { $ref: '#/components/schemas/CdcConnectorType' }
        status: { type: string, enum: [active, paused, error, provisioning] }
        statusMessage: { type: string, nullable: true }
        replicationTables:
          type: array
          items: { type: string }
        config: { type: object, additionalProperties: true }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncRecordCount: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      description: Connection strings are write-only and are never returned.
    CdcPipelineCreate:
      type: object
      required: [pipeline_name, cdc_connector_type, source_database_connection, clickhouse_sink_connection, replication_tables]
      properties:
        pipeline_name: { type: string, minLength: 1, maxLength: 128 }
        cdc_connector_type: { $ref: '#/components/schemas/CdcConnectorType' }
        source_database_connection: { type: string, minLength: 1, writeOnly: true }
        clickhouse_sink_connection: { type: string, minLength: 1, writeOnly: true }
        intermediary_connection: { type: string, minLength: 1, writeOnly: true }
        replication_tables:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        config: { type: object, additionalProperties: true }
    CdcPipelinePatch:
      type: object
      properties:
        pipeline_name: { type: string, minLength: 1, maxLength: 128 }
        source_database_connection: { type: string, minLength: 1, writeOnly: true }
        clickhouse_sink_connection: { type: string, minLength: 1, writeOnly: true }
        intermediary_connection: { type: string, minLength: 1, nullable: true, writeOnly: true }
        replication_tables:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        config: { type: object, additionalProperties: true }
    CdcHealthCheck:
      type: object
      properties:
        healthy: { type: boolean }
        latencyMs: { type: number }
        error: { type: string }
        details: { type: object, additionalProperties: true }
    CdcPipelineMetrics:
      type: object
      properties:
        pipelineId: { type: string }
        replicationLagMs: { type: integer }
        eventsPerSecond: { type: integer }
        errorCount: { type: integer }
        lastEventAt: { type: string, format: date-time, nullable: true }
        status: { type: string }
    CdcHealthMetricEntry:
      type: object
      properties:
        pipelineId: { type: string }
        replicationLagMs: { type: integer }
        eventsPerSecond: { type: integer }
        errorCount: { type: integer }
        recordedAt: { type: string, format: date-time }
    CdcDeployRequest:
      type: object
      required: [approach, target]
      properties:
        approach: { $ref: '#/components/schemas/CdcConnectorType' }
        target: { $ref: '#/components/schemas/CdcDeploymentTarget' }
        pipeline_id: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
    CdcValidateEnvRequest:
      type: object
      required: [approach, target, env]
      properties:
        approach: { $ref: '#/components/schemas/CdcConnectorType' }
        target: { $ref: '#/components/schemas/CdcDeploymentTarget' }
        env:
          type: object
          additionalProperties: { type: string }
    CdcEnvValidationResult:
      type: object
      properties:
        valid: { type: boolean }
        invalidFields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              reason: { type: string }
    CdcDeploymentResult:
      type: object
      properties:
        deploymentId: { type: string }
        status: { type: string, enum: [pending, running, completed, failed, rolled_back] }
        steps:
          type: array
          items: { type: object, additionalProperties: true }
        completedAt: { type: string, format: date-time }
        error: { type: object, additionalProperties: true, nullable: true }


paths:
  /utils/health:
    get:
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /utils/version:
    get:
      summary: API + runtime version
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Version' }
  /collections:
    get:
      summary: List collections in the active site
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Collection' }
    post:
      summary: Create a collection
      parameters: [{ $ref: '#/components/parameters/SiteHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Collection' }
      responses:
        '201':
          description: Created
