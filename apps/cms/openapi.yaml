    parameters:
      - $ref: '#/components/parameters/SiteHeader'
    get:
      summary: List CDC pipelines for the active site
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      pipelines:
                        type: array
                        items: { $ref: '#/components/schemas/CdcPipeline' }
