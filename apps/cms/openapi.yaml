      responses:
        '201':
          description: Installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ExtensionResource' }
        '409':
          description: Already installed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /marketplace/publish:
    post:
      summary: Publish an extension to the marketplace
