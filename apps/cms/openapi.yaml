        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CdcPipelineCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/CdcPipeline' }
        '400':
          description: Validation or connectivity failure
