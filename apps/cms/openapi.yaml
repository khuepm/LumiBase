    get:
      summary: Get flow detail (incl. graph)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FlowResource' }
        '404':
          description: Not found
