# Production override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Differences from dev:
# - Uses the published CMS image by default (no hot-reload)
# - No source code volume mounts
# - NODE_ENV=production
# - Keeps stateful services on the private Compose network
# - Supports Docker secret files via *_FILE environment variables
# - Read-only root filesystem, no capabilities, no privilege escalation (#734)

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    ports: !reset []

  meilisearch:
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:-}
    ports: !reset []

  imgproxy:
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
    ports: !reset []

  cms:
    build: !reset null
    image: ${LUMIBASE_CMS_IMAGE:-ghcr.io/khuepm/lumibase-cms:${LUMIBASE_VERSION:-latest}}
    environment:
      NODE_ENV: production
      LUMIBASE_ENV: production
      LUMIBASE_ALLOW_ORG_SIGNUP: ${LUMIBASE_ALLOW_ORG_SIGNUP:-false}
      LUMIBASE_MCP_ORG_TOOLS: ${LUMIBASE_MCP_ORG_TOOLS:-on}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      DATABASE_SYSTEM_URL: ${DATABASE_SYSTEM_URL:-}
      DATABASE_SYSTEM_URL_FILE: ${DATABASE_SYSTEM_URL_FILE:-}
      LUMIBASE_DB_RLS: ${LUMIBASE_DB_RLS:-off}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-require}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_URL_FILE: ${REDIS_URL_FILE:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: ${JWT_SECRET_FILE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_FILE: ${ENCRYPTION_KEY_FILE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes: !reset []
    # Hardened runtime (#734). The image is distroless and runs as UID 65532;
    # the server writes nothing to its filesystem (state lives in PostgreSQL,
    # Redis and S3), so the root filesystem is mounted read-only. /tmp is a
    # small tmpfs only for third-party code that asks os.tmpdir() — LumiBase
    # itself does not use it. `init: true` adds Docker's tiny init as PID 1 so
    # the migration child processes the entrypoint spawns are always reaped.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  bull-board:
    ports: !reset []
